<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教會服事班表</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 唯讀樣式 */
        .service-cell {
            cursor: default !important;
        }

        .service-cell:hover {
            background: white !important;
        }

        .person-chip {
            cursor: default;
        }

        .schedule-table th.service-header {
            cursor: default;
        }

        .header-section {
            justify-content: center;
        }

        .control-actions {
            display: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="header-section">
            <div class="app-title">
                <h1 style="display: inline;"><span id="collectionEmoji">⛪</span> <span
                        id="collectionTitle">教會服事班表</span></h1>
            </div>
            <!-- 分組過濾器 -->
            <div class="group-filter" id="groupFilter" style="display: none;">
                <!-- 動態生成 -->
            </div>
            <div class="status-indicator">
            </div>
        </div>

        <div class="table-container">
            <div class="table-scroll">
                <table class="schedule-table" id="scheduleTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js';
        import { getFirestore, collection, doc, getDocs, getDoc, query, orderBy, where, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { firebaseConfig, RECAPTCHA_SITE_KEY } from './firebase-config.js';

        // 從 URL 參數取得崇拜名稱
        const urlParams = new URLSearchParams(window.location.search);
        const serviceName = urlParams.get('service') || '';
        const userName = urlParams.get('user') || '';

        // 實際的 collection 名稱（從 serve-list 搜尋得到）
        let collectionName = '';

        // 顯示錯誤頁面
        function showError(title, message) {
            const userParam = userName ? `?user=${encodeURIComponent(userName)}` : '';
            document.querySelector('.app-container').innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center;">
                    <h1 style="color: #ef4444; font-size: 48px; margin-bottom: 16px;">⚠️</h1>
                    <h2 style="color: #ef4444; margin-bottom: 8px;">${escapeHtml(title)}</h2>
                    <p style="color: #64748b;">${escapeHtml(message)}</p>
                    <a href="index.html${userParam}" class="btn btn-primary" style="margin-top: 24px;">返回選擇頁面</a>
                </div>
            `;
        }

        function escapeHtml(value = '') {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        let scheduleData = [];
        let pastData = []; // 過去的資料（現在日期前5週）
        let serviceItems = [];
        let personColorMap = new Map();
        let allPersonNames = new Set();
        let displayConfig = null;
        let visibleGroups = {}; // 記錄各群組的顯示狀態
        let showPast = false; // 是否顯示過去資料
        let pastDataLoaded = false; // 歷史資料是否已載入
        let db = null; // Firebase db 參考
        const MAX_DISPLAY_ROWS = 26; // 最多顯示筆數
        const MAX_PAST_ROWS = 5; // 歷史資料最多筆數

        // 將日期格式化為字串
        function formatDateString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}.${month}.${day}`;
        }

        // 取得當前週日日期（UTC+8 時區，週日為基準）
        // 如果今天是週日，返回今天；否則返回下一個週日
        function getCurrentSunday() {
            const now = new Date();
            const utc8Offset = 8 * 60 * 60 * 1000;
            const utc8Now = new Date(now.getTime() + utc8Offset + now.getTimezoneOffset() * 60000);

            const dayOfWeek = utc8Now.getDay();
            const sunday = new Date(utc8Now);

            if (dayOfWeek === 0) {
                // 今天是週日，返回今天
                sunday.setHours(0, 0, 0, 0);
            } else {
                // 今天不是週日，返回下一個週日
                sunday.setDate(utc8Now.getDate() + (7 - dayOfWeek));
                sunday.setHours(0, 0, 0, 0);
            }
            return sunday;
        }

        // 將日期字串解析為 Date 物件
        function parseDateString(dateStr) {
            const parts = dateStr.split('.');
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        }

        async function init() {
            try {
                const app = initializeApp(firebaseConfig);

                // 初始化 App Check
                initializeAppCheck(app, {
                    provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
                    isTokenAutoRefreshEnabled: true
                });

                db = getFirestore(app);

                // 第一層並行：同時取得 serve-list
                const serve = await loadAndValidateService(db);
                if (!serve) {
                    return; // 驗證失敗，showError 已顯示錯誤訊息
                }

                // 設定 collectionName
                collectionName = serve.id;

                // 更新頁面標題
                document.getElementById('collectionEmoji').textContent = serve.emoji || '⛪';
                document.getElementById('collectionTitle').textContent = serve.name + '班表';
                document.title = `${serve.name}班表`;

                // 第二層並行：同時發起 metadata 讀取 + 班表 query
                await loadDataAndConfig(db);

                // 初始化分組過濾器並渲染表格
                initGroupFilter();

                // 渲染表格
                renderTable();
            } catch (error) {
                console.error('初始化失敗:', error);
            }
        }

        // 載入崇拜列表並驗證（使用崇拜名稱搜尋）
        async function loadAndValidateService(db) {
            const serveListRef = doc(db, '_config', 'serve-list');
            const serveListDoc = await getDoc(serveListRef);

            if (!serveListDoc.exists()) {
                showError('尚未設定', '請先到管理頁面新增崇拜');
                return null;
            }

            const serveList = serveListDoc.data().serves || [];
            if (serveList.length === 0) {
                showError('尚未設定', '請先到管理頁面新增崇拜');
                return null;
            }

            // 使用崇拜名稱搜尋對應的 serve 物件
            const serve = serveList.find(s => s.name === serviceName);
            if (!serve) {
                showError('找不到班表', `無效的崇拜名稱: ${serviceName || '(未指定)'}`);
                return null;
            }

            return serve;
        }

        // 合併載入 metadata + 班表資料 + displayConfig（一次讀取 metadata，並行發起 query）
        async function loadDataAndConfig(db) {
            const metadataRef = doc(db, collectionName, '_metadata');
            const currentSundayStr = formatDateString(getCurrentSunday());

            const scheduleQuery = query(
                collection(db, collectionName),
                where('__name__', '>=', currentSundayStr),
                orderBy('__name__'),
                limit(MAX_DISPLAY_ROWS)
            );

            // 同時發起 metadata 讀取和班表 query
            const [metadataDoc, snapshot] = await Promise.all([
                getDoc(metadataRef),
                getDocs(scheduleQuery)
            ]);

            // 處理 metadata（同時取得 serviceItems 和 displayConfig）
            if (metadataDoc.exists()) {
                const meta = metadataDoc.data();
                serviceItems = meta.serviceItems || [];
                displayConfig = meta.displayConfig || null;
            }

            // 處理班表資料
            scheduleData = [];
            snapshot.forEach(docRef => {
                if (docRef.id !== '_metadata') {
                    const data = docRef.data();
                    scheduleData.push({ date: docRef.id, ...data });

                    // 收集人名
                    serviceItems.forEach(service => {
                        if (data[service]) {
                            data[service].forEach(name => allPersonNames.add(name));
                        }
                    });
                }
            });
        }

        // 載入過去資料（延遲載入，第一次勾選時才調用）
        async function loadPastData() {
            if (pastDataLoaded) return; // 已載入則跳過
            pastDataLoaded = true;

            try {
                const currentSundayStr = formatDateString(getCurrentSunday());

                // 使用 Firestore query 載入當前週日之前的資料
                // 計算 MAX_PAST_ROWS 週前的日期
                const minPastDate = new Date(getCurrentSunday());
                minPastDate.setDate(minPastDate.getDate() - (MAX_PAST_ROWS * 7));
                const minPastDateStr = formatDateString(minPastDate);

                const q = query(
                    collection(db, collectionName),
                    where('__name__', '>=', minPastDateStr),
                    where('__name__', '<', currentSundayStr),
                    orderBy('__name__')
                );
                const snapshot = await getDocs(q);

                pastData = [];
                snapshot.forEach(docRef => {
                    if (docRef.id !== '_metadata') {
                        const data = docRef.data();
                        pastData.push({ date: docRef.id, ...data });

                        // 將歷史資料的人名也加入顏色映射
                        serviceItems.forEach(service => {
                            if (data[service]) {
                                data[service].forEach(name => allPersonNames.add(name));
                            }
                        });
                    }
                });

            } catch (error) {
                console.log('無過去資料或載入失敗:', error);
                pastData = [];
            }
        }

        function renderTable() {
            renderTableHead();
            renderTableBody();
        }


        // 初始化分組過濾器
        function initGroupFilter() {
            const filterContainer = document.getElementById('groupFilter');
            let html = '';
            let hasContent = false;

            // 檢查是否有分組設定且有非 ungrouped 的群組
            if (displayConfig && displayConfig.groups) {
                const nonUngroupedGroups = displayConfig.groups.filter(g => g.id !== 'ungrouped' && g.items.length > 0);

                if (nonUngroupedGroups.length > 0) {
                    hasContent = true;

                    // 初始化各群組的顯示狀態
                    displayConfig.groups.forEach(group => {
                        visibleGroups[group.id] = group.defaultVisible !== false;
                    });

                    // 渲染分組 checkbox
                    nonUngroupedGroups.forEach(group => {
                        const checked = visibleGroups[group.id] ? 'checked' : '';
                        const escapedGroupId = escapeHtml(group.id);
                        const escapedGroupName = escapeHtml(group.name);
                        html += `
                            <label class="group-filter-item">
                                <input type="checkbox" ${checked} data-group-id="${escapedGroupId}" onchange="window.handleGroupFilterChange(this)">
                                ${escapedGroupName}
                            </label>
                        `;
                    });
                }
            }

            // 新增「顯示前5週」選項（始終顯示，因為延遲載入）
            hasContent = true;
            const separator = html ? 'style="margin-left: 16px; border-left: 1px solid #ddd; padding-left: 16px;"' : '';
            html += `
                <label class="group-filter-item" ${separator}>
                    <input type="checkbox" id="showPastCheckbox" onchange="window.handleShowPastChange(this)">
                    顯示前5週
                </label>
            `;

            if (hasContent) {
                filterContainer.style.display = 'flex';
                filterContainer.innerHTML = html;
            } else {
                filterContainer.style.display = 'none';
            }
        }

        // 處理顯示過去資料變更
        window.handleShowPastChange = async function (checkbox) {
            showPast = checkbox.checked;
            if (showPast && !pastDataLoaded) {
                // 第一次勾選時載入歷史資料
                await loadPastData();
            }
            renderTable();
        };

        // 處理群組過濾器變更
        window.handleGroupFilterChange = function (checkbox) {
            const groupId = checkbox.dataset.groupId;
            visibleGroups[groupId] = checkbox.checked;
            renderTable();
        };

        // 取得可見的服事項目
        function getVisibleServiceItems() {
            if (!displayConfig || !displayConfig.groups) {
                return serviceItems;
            }

            const visible = [];
            const hidden = displayConfig.hidden || [];
            let ungroupedItems = [];

            // 先處理非 ungrouped 群組
            displayConfig.groups.forEach(group => {
                if (group.id === 'ungrouped') {
                    // 儲存 ungrouped 項目稍後處理
                    ungroupedItems = group.items.filter(item => !hidden.includes(item));
                } else if (visibleGroups[group.id]) {
                    // 其他群組根據勾選狀態加入
                    visible.push(...group.items.filter(item => !hidden.includes(item)));
                }
            });

            // 最後加入未分組的項目
            visible.push(...ungroupedItems);

            return visible;
        }

        // 更新的 renderTableHead
        function renderTableHead() {
            const thead = document.getElementById('tableHead');
            const visibleItems = getVisibleServiceItems();

            let html = '<tr><th class="date-header">日期</th>';
            visibleItems.forEach(item => {
                html += `<th class="service-header">${escapeHtml(item)}</th>`;
            });
            html += '</tr>';
            thead.innerHTML = html;
        }

        // 更新的 renderTableBody
        // 更新的 renderTableBody
        function renderTableBody() {
            const tbody = document.getElementById('tableBody');
            const visibleItems = getVisibleServiceItems();
            const highlightUser = urlParams.get('user');
            let html = '';

            // 組合要顯示的資料
            let dataToShow = [];
            if (showPast && pastData.length > 0) {
                dataToShow = [...pastData, ...scheduleData];
            } else {
                dataToShow = scheduleData;
            }

            dataToShow.forEach((row, index) => {
                // 過去資料添加淡化樣式
                const isPast = showPast && index < pastData.length;
                const rowStyle = isPast ? 'opacity: 0.6; background: #f8fafc;' : '';

                html += `<tr style="${rowStyle}">`;
                html += `<td><div class="date-cell">${escapeHtml(row.date.replaceAll('.', '/'))}</div></td>`;

                visibleItems.forEach(item => {
                    const persons = row[item] || [];
                    const personText = persons.join('/');
                    let cellStyle = '';

                    // 如果有指定 user 且內容包含該 user，則 highlight
                    if (highlightUser && personText.includes(highlightUser)) {
                        cellStyle = 'background-color: #ffe08a;'; // Yellow highlight
                    }

                    html += `<td class="service-cell" style="${cellStyle}">`;
                    if (persons.length > 0) {
                        // 簡化顯示：文字用 / 連接
                        html += `<span style="font-weight: 550">${escapeHtml(personText)}</span>`;
                    }
                    html += '</td>';
                });

                html += '</tr>';
            });

            tbody.innerHTML = html;
        }

        init();
    </script>
</body>

</html>
