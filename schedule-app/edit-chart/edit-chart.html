<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教會服事班表系統</title>
  <link rel="stylesheet" href="../styles.css">
</head>

<body>
  <div class="app-container">
    <!-- 頂部控制區 (合併標題與控制面板) -->
    <div class="header-section">
      <div class="app-title">
        <a href="index.html" class="btn btn-secondary" style="margin-right: 12px; padding: 6px 12px;">← 返回</a>
        <h1 style="display: inline;">⛪ <span id="collectionTitle">教會服事班表</span></h1>
      </div>

      <div class="control-actions compact">
        <button class="btn btn-secondary" id="showPastBtn" style="display: none;" onclick="togglePastData()">
          📅 顯示歷史
        </button>
        <div class="btn-group">
          <button class="btn btn-secondary btn-group-left" id="undoBtn" title="上一步 (Ctrl+Z)" disabled>
            ⬅️ 上一步
          </button>
          <button class="btn btn-secondary btn-group-right" id="redoBtn" title="下一步 (Ctrl+Y)" disabled>
            下一步 ➡️
          </button>
        </div>
        <button class="btn btn-secondary" id="addServiceBtn">
          ✨ 新增服事
        </button>
        <button class="btn btn-secondary" id="addInfoColumnBtn">
          📝 新增資訊欄位
        </button>
        <button class="btn btn-secondary" id="editDisplayConfigBtn">
          📊 編輯顯示欄位
        </button>
        <button class="btn btn-secondary" id="viewLogsBtn">
          📜 編輯記錄
        </button>
        <button class="btn btn-secondary btn-with-badge" id="manageUsersBtn">
          👥 管理使用者
          <span class="badge-alert hidden" id="userAlertBadge">!</span>
        </button>
      </div>

      <div class="status-indicator">
        <div class="text-muted" id="statusText">載入中...</div>
      </div>
    </div>

    <!-- 表格容器 -->
    <div class="table-container">
      <div class="table-scroll">
        <table class="schedule-table" id="scheduleTable">
          <thead id="tableHead">
            <!-- 動態生成 -->
          </thead>
          <tbody id="tableBody">
            <!-- 動態生成 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- 右鍵選單 -->
    <div class="context-menu hidden" id="contextMenu">
      <div class="context-menu-item" id="contextMenuPaste">📋 從此格貼上</div>
    </div>
  </div>

  <!-- 編輯服事項目對話框 -->
  <div class="modal-overlay hidden" id="editServiceModal">
    <div class="modal">
      <div class="modal-header">
        <h2>編輯服事項目</h2>
        <button class="modal-close" onclick="closeModal('editServiceModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>服事項目名稱</label>
          <input type="text" class="form-control" id="serviceNameInput" placeholder="請輸入服事項目名稱">
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="isInfoColumnCheckbox" style="width: 18px; height: 18px; cursor: pointer;">
          <label for="isInfoColumnCheckbox" style="margin: 0; cursor: pointer;">這是資訊欄位（不包含人名）</label>
        </div>
      </div>
      <div class="modal-footer" style="justify-content: space-between;">
        <button class="btn btn-danger" id="deleteServiceBtn">移除服事項目</button>
        <div style="display: flex; gap: 16px;">
          <button class="btn btn-secondary" onclick="closeModal('editServiceModal')">取消</button>
          <button class="btn btn-primary" id="saveServiceBtn">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 編輯人員對話框 -->
  <div class="modal-overlay hidden" id="editPersonModal">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>編輯服事人員</h2>
          <div class="modal-subtitle" id="editPersonModalSubtitle">
            <!-- 動態顯示日期和服事項目 -->
          </div>
        </div>
        <button class="modal-close" onclick="closeModal('editPersonModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>選擇現有人員或輸入新人員</label>
          <div class="person-select-container" id="personSelectContainer">
            <!-- 動態生成的現有人員積木 -->
            <div class="person-chips-select" id="personDropdown">
              <!-- 動態生成 -->
            </div>
            <!-- 輸入新人員的空白積木 -->
            <div class="person-chip-input-wrapper">
              <input type="text" class="person-chip-input" id="newPersonInput" placeholder="輸入新姓名...">
              <button class="person-chip-input-btn" id="addPersonChipBtn">+</button>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>目前服事人員</label>
          <div class="person-chips" id="currentPersonChips">
            <!-- 動態生成 -->
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="closeModal('editPersonModal')">完成</button>
      </div>
    </div>
  </div>

  <!-- 編輯顯示欄位對話框 -->
  <div class="modal-overlay hidden" id="displayConfigModal">
    <div class="modal" style="max-width: 800px; max-height: 80vh;">
      <div class="modal-header">
        <h2>📊 編輯顯示欄位</h2>
        <button class="modal-close" onclick="closeModal('displayConfigModal')">&times;</button>
      </div>
      <div class="modal-body" style="overflow-y: auto; max-height: 60vh;">
        <!-- 群組區域 -->
        <div id="displayConfigGroups" class="display-config-groups">
          <!-- 動態生成 -->
        </div>

        <!-- 新增群組按鈕 -->
        <div class="add-group-section">
          <button class="btn btn-secondary" id="addGroupBtn" style="width: 100%;">
            ➕ 新增群組
          </button>
        </div>

        <!-- 不顯示區域 -->
        <div class="hidden-zone" id="hiddenZone">
          <div class="hidden-zone-title">🚫 不顯示區域 (拖入此處的項目會隱藏)</div>
          <div class="hidden-zone-items" id="hiddenZoneItems">
            <!-- 動態生成 -->
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('displayConfigModal')">取消</button>
        <button class="btn btn-primary" id="saveDisplayConfigBtn">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    console.log('🚀 開始初始化 Firebase...');

    // 引入 Firebase
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js';
    import { getFirestore, collection, doc, getDocs, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, where, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // 引入配置
    import { firebaseConfig, RECAPTCHA_SITE_KEY } from '../firebase-config.js';

    // 從 URL 參數取得 collection 名稱
    const urlParams = new URLSearchParams(window.location.search);
    const collectionName = urlParams.get('collection') || '';

    // 顯示錯誤頁面
    function showError(title, message) {
      document.querySelector('.app-container').innerHTML = `
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center;">
          <h1 style="color: #ef4444; font-size: 48px; margin-bottom: 16px;">⚠️</h1>
          <h2 style="color: #ef4444; margin-bottom: 8px;">${title}</h2>
          <p style="color: #64748b;">${message}</p>
          <a href="index.html" class="btn btn-primary" style="margin-top: 24px;">返回選擇頁面</a>
        </div>
      `;
    }

    // 載入崇拜列表並驗證
    async function loadAndValidateCollection(db) {
      const { doc, getDoc } = window.firestore;
      const serveListRef = doc(db, '_config', 'serve-list');
      const serveListDoc = await getDoc(serveListRef);

      if (!serveListDoc.exists()) {
        showError('尚未設定', '請先到管理頁面新增崇拜');
        return null;
      }

      const serveList = serveListDoc.data().serves || [];
      if (serveList.length === 0) {
        showError('尚未設定', '請先到管理頁面新增崇拜');
        return null;
      }

      // 檢查 collection 是否有效
      const serve = serveList.find(s => s.id === collectionName);
      if (!serve) {
        showError('找不到班表', `無效的班表名稱: ${collectionName || '(未指定)'}`);
        return null;
      }

      return serve;
    }

    // 更新頁面標題（在驗證成功後呼叫）
    function updatePageTitle(serve) {
      document.getElementById('collectionTitle').textContent = serve.name + '班表';
      document.title = `${serve.name}班表 - 教會服事班表系統`;
    }

    // 記錄進入頁面的時間
    const sessionStartTime = new Date();
    const formatSessionTime = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const h = String(date.getHours()).padStart(2, '0');
      const min = String(date.getMinutes()).padStart(2, '0');
      return `${y}.${m}.${d}.${h}.${min}`;
    };
    window.SESSION_START_TIME = formatSessionTime(sessionStartTime);

    console.log('📝 Firebase 配置:', {
      projectId: firebaseConfig.projectId,
      authDomain: firebaseConfig.authDomain,
      collectionName: collectionName
    });

    // 初始化 Firebase（使用 async IIFE）
    (async function initFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        console.log('✅ Firebase App 初始化成功');

        // 初始化 App Check
        const appCheck = initializeAppCheck(app, {
          provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
          isTokenAutoRefreshEnabled: true
        });

        const db = getFirestore(app);
        console.log('✅ Firestore 連接成功');

        // 將全域變數掛載到 window
        window.db = db;
        window.firestore = { collection, doc, getDocs, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, where, limit };
        window.COLLECTION_NAME = collectionName;

        console.log('✅ Firebase 全域變數已設定');

        // 驗證 collection 是否有效
        const serve = await loadAndValidateCollection(db);
        if (!serve) {
          return; // 驗證失敗，showError 已顯示錯誤訊息
        }

        // 更新頁面標題
        updatePageTitle(serve);

        // 載入主要應用程式（單一檔案 app.js）
        import('./app.js').then(() => {
          console.log('✅ app.js 已載入');
        }).catch(error => {
          console.error('❌ 載入應用程式失敗:', error);
          document.getElementById('statusText').textContent = '載入失敗，請檢查 Firebase 配置';
        });
      } catch (error) {
        console.error('❌ Firebase 初始化失敗:', error);
        console.error('錯誤詳情:', {
          name: error.name,
          message: error.message,
          code: error.code
        });
        document.getElementById('statusText').textContent = 'Firebase 初始化失敗';
        alert(`Firebase 初始化失敗：${error.message}\n\n請檢查 firebase-config.js 中的配置是否正確。`);
      }
    })();
  </script>

</body>

</html>
