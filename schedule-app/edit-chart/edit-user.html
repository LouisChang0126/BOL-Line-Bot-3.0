<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用者管理</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .admin-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .search-box {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            width: 250px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* 服事項目可編輯區塊 */
        .serve-section {
            margin-bottom: 16px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
        }

        .serve-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .serve-section-title {
            font-weight: 600;
            font-size: 14px;
        }

        .serve-items-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .serve-item-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--primary-light);
            color: var(--primary-color);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
        }

        .serve-item-remove {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.1);
            color: var(--primary-color);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
        }

        .serve-item-remove:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .add-serve-btn {
            padding: 4px 10px;
            background: white;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .add-serve-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* 新增使用者按鈕樣式 */
        .add-user-card {
            border: 2px dashed var(--border-color);
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            font-size: 16px;
            color: var(--text-secondary);
        }

        .add-user-card:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* 服事選擇下拉選單 */
        .serve-dropdown {
            position: absolute;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            z-index: 1100;
            max-height: 200px;
            overflow-y: auto;
            min-width: 150px;
        }

        .serve-dropdown-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
        }

        .serve-dropdown-item:hover {
            background: var(--bg-hover);
        }

        .serve-dropdown-item.disabled {
            color: var(--text-light);
            cursor: not-allowed;
        }

        /* 複製邀請碼按鈕 - badge 樣式 */
        .copy-invite-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: #fef3c7;
            border: 1px solid #fcd34d;
            border-radius: 12px;
            font-size: 11px;
            color: #92400e;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .copy-invite-btn:hover {
            background: #fde68a;
            border-color: #f59e0b;
        }

        .copy-invite-btn.copied {
            background: #d1fae5;
            border-color: #34d399;
            color: #065f46;
        }

        /* Line Bot ID 選擇器 */
        .line-bot-selector {
            display: flex;
            gap: 0;
        }

        .line-bot-btn {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .line-bot-btn:first-child {
            border-radius: 8px 0 0 8px;
        }

        .line-bot-btn:last-child {
            border-radius: 0 8px 8px 0;
        }

        .line-bot-btn:not(:first-child) {
            border-left: none;
        }

        .line-bot-btn:hover {
            background: var(--bg-hover);
        }

        .line-bot-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .line-bot-btn.active+.line-bot-btn {
            border-left-color: var(--primary-color);
        }
    </style>
</head>

<body>
    <div class="admin-page">
        <div class="page-header">
            <a id="backBtn" href="edit-chart.html" class="btn btn-secondary" style="padding: 6px 12px;">← 返回</a>
            <h1>👥 <span id="pageTitle">使用者管理</span></h1>
        </div>

        <!-- 快速操作區 -->
        <div class="quick-actions">
            <button class="btn btn-primary" id="autoAddUsersBtn">
                🔄 自動加入使用者 & 更新服事
            </button>
            <button class="btn btn-secondary" id="exportExcelBtn">
                📥 匯出邀請碼 Excel
            </button>
            <input type="text" class="search-box" id="searchBox" placeholder="搜尋使用者...">
            <div class="stats-info">
                <span>總計 <strong id="totalUsers">0</strong> 位使用者</span>
                <span>待處理 <strong id="newUsers">0</strong> 位</span>
            </div>
        </div>

        <!-- 使用者列表 -->
        <div class="user-list" id="userList">
            <div style="text-align: center; padding: 40px; color: var(--text-secondary);">載入中...</div>
        </div>
    </div>

    <!-- 新增使用者 Modal -->
    <div class="modal-overlay hidden" id="addUserModal">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h2>新增使用者</h2>
                <button class="modal-close" onclick="closeModal('addUserModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>使用者名稱</label>
                    <input type="text" class="form-control" id="newUserNameInput" placeholder="請輸入使用者名稱" maxlength="10">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addUserModal')">取消</button>
                <button class="btn btn-primary" id="confirmAddUserBtn">新增</button>
            </div>
        </div>
    </div>

    <!-- 編輯使用者 Modal -->
    <div class="modal-overlay hidden" id="editUserModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h2>編輯使用者：<span id="editUserName"></span></h2>
                <button class="modal-close" onclick="closeModal('editUserModal')">&times;</button>
            </div>
            <div class="modal-body">
                <!-- LINE ID -->
                <div class="form-group">
                    <label>LINE ID</label>
                    <input type="text" class="form-control" id="lineIdInput" placeholder="輸入 LINE 使用者 ID">
                </div>

                <!-- Line Bot ID 選擇器 -->
                <div class="form-group">
                    <label>Line Bot ID（使用哪台機器人）</label>
                    <div class="line-bot-selector" id="lineBotSelector">
                        <button type="button" class="line-bot-btn" data-value="0">無</button>
                        <button type="button" class="line-bot-btn" data-value="1">1</button>
                        <button type="button" class="line-bot-btn" data-value="2">2</button>
                        <button type="button" class="line-bot-btn" data-value="3">3</button>
                        <button type="button" class="line-bot-btn" data-value="4">4</button>
                    </div>
                </div>

                <!-- 提醒設定 -->
                <div class="form-group">
                    <label>提醒設定（週一至週六）</label>
                    <div class="alarm-settings" id="alarmSettings">
                        <label class="alarm-checkbox-item">
                            <input type="checkbox" id="alarm0"> 週一
                        </label>
                        <label class="alarm-checkbox-item">
                            <input type="checkbox" id="alarm1"> 週二
                        </label>
                        <label class="alarm-checkbox-item">
                            <input type="checkbox" id="alarm2"> 週三
                        </label>
                        <label class="alarm-checkbox-item">
                            <input type="checkbox" id="alarm3"> 週四
                        </label>
                        <label class="alarm-checkbox-item">
                            <input type="checkbox" id="alarm4"> 週五
                        </label>
                        <label class="alarm-checkbox-item">
                            <input type="checkbox" id="alarm5"> 週六
                        </label>
                    </div>
                </div>

                <!-- 服事項目 -->
                <div class="form-group">
                    <label>服事項目</label>
                    <div id="serveTypesDisplay">
                        <!-- 動態生成 -->
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="justify-content: space-between;">
                <button class="btn btn-danger" id="deleteUserBtn">刪除使用者</button>
                <div style="display: flex; gap: 16px;">
                    <button class="btn btn-secondary" onclick="closeModal('editUserModal')">取消</button>
                    <button class="btn btn-primary" id="saveUserBtn">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js';
        import { getFirestore, collection, doc, getDocs, getDoc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { firebaseConfig, RECAPTCHA_SITE_KEY } from '../firebase-config.js';

        // 動態載入的崇拜列表
        let serveList = [];
        let SERVE_DISPLAY_NAMES = {};
        let VALID_COLLECTIONS = [];

        // 從 URL 取得 collection
        const urlParams = new URLSearchParams(window.location.search);
        const targetCollection = urlParams.get('collection');

        let db;
        let allUsers = {}; // { userName: userData }
        let schedulePersons = new Set(); // 班表中出現的所有人名
        let personServeItems = {}; // 班表中每個人的服事項目 { name: Set }
        let serviceItemsByCollection = {}; // 各崇拜的服事項目 { collectionName: [] }
        let currentEditUser = null;
        let currentEditServeTypes = {}; // 編輯中的 serve_types
        let currentEditLoginToken = ''; // 編輯中的 login_token

        // 生成 16 位隨機 login_token
        function generateLoginToken() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let token = '';
            for (let i = 0; i < 16; i++) {
                token += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return token;
        }

        // 取得當前週日日期（UTC+8 時區，週日為基準）
        // 如果今天是週日，返回今天；否則返回下一個週日
        function getCurrentSunday() {
            const now = new Date();
            const utc8Offset = 8 * 60 * 60 * 1000;
            const utc8Now = new Date(now.getTime() + utc8Offset + now.getTimezoneOffset() * 60000);

            const dayOfWeek = utc8Now.getDay();
            const sunday = new Date(utc8Now);

            if (dayOfWeek === 0) {
                // 今天是週日，返回今天
                sunday.setHours(0, 0, 0, 0);
            } else {
                // 今天不是週日，返回下一個週日
                sunday.setDate(utc8Now.getDate() + (7 - dayOfWeek));
                sunday.setHours(0, 0, 0, 0);
            }
            return sunday;
        }

        // 格式化日期為字串 (YYYY.MM.DD)
        function formatDateString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}.${month}.${day}`;
        }

        function showError(message) {
            document.querySelector('.admin-page').innerHTML = `
                <div style="text-align: center; padding: 60px;">
                    <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                    <h2 style="color: #dc2626; margin-bottom: 8px;">錯誤</h2>
                    <p style="color: var(--text-secondary); margin-bottom: 24px;">${message}</p>
                    <a href="index.html" class="btn btn-primary">返回首頁</a>
                </div>
            `;
        }

        async function init() {
            try {
                const app = initializeApp(firebaseConfig);

                // 初始化 App Check
                const appCheck = initializeAppCheck(app, {
                    provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
                    isTokenAutoRefreshEnabled: true
                });

                db = getFirestore(app);

                // 載入崇拜列表
                const configValid = await loadServeList();
                if (!configValid) return;

                // 檢查 collection 參數
                if (targetCollection && !VALID_COLLECTIONS.includes(targetCollection)) {
                    showError(`找不到崇拜「${targetCollection}」`);
                    return;
                }

                // 設定頁面標題
                if (targetCollection) {
                    const displayName = SERVE_DISPLAY_NAMES[targetCollection] || targetCollection;
                    document.getElementById('pageTitle').textContent = `${displayName} 使用者管理`;
                    document.title = `${displayName} 使用者管理`;
                    document.getElementById('backBtn').href = `edit-chart.html?collection=${targetCollection}`;
                } else {
                    document.getElementById('pageTitle').textContent = '所有使用者管理';
                    document.title = '所有使用者管理';
                    document.getElementById('backBtn').href = 'index.html';
                }

                // 載入資料
                await loadAllServiceItems();
                if (targetCollection) {
                    await loadSchedulePersons();
                }
                await loadUsers();

                // 渲染使用者列表
                renderUserList();

                // 設定事件
                setupEventListeners();

            } catch (error) {
                console.error('初始化失敗:', error);
                document.getElementById('userList').innerHTML =
                    '<div style="text-align: center; padding: 40px; color: #ef4444;">載入失敗</div>';
            }
        }

        // 載入崇拜列表
        async function loadServeList() {
            const serveListRef = doc(db, '_config', 'serve-list');
            const serveListDoc = await getDoc(serveListRef);

            if (!serveListDoc.exists()) {
                showError('尚未設定任何崇拜，請先到管理頁面新增');
                return false;
            }

            serveList = serveListDoc.data().serves || [];

            if (serveList.length === 0) {
                showError('尚未設定任何崇拜，請先到管理頁面新增');
                return false;
            }

            // 建立對照表
            VALID_COLLECTIONS = serveList.map(s => s.id);
            SERVE_DISPLAY_NAMES = {};
            serveList.forEach(s => {
                SERVE_DISPLAY_NAMES[s.id] = s.name;
            });

            return true;
        }

        // 載入所有崇拜的服事項目
        let nonUserColumnsByCollection = {}; // 各崇拜的資訊欄位
        async function loadAllServiceItems() {
            for (const collName of VALID_COLLECTIONS) {
                try {
                    const metadataRef = doc(db, collName, '_metadata');
                    const metadataDoc = await getDoc(metadataRef);
                    if (metadataDoc.exists()) {
                        serviceItemsByCollection[collName] = metadataDoc.data().serviceItems || [];
                        nonUserColumnsByCollection[collName] = metadataDoc.data().nonUserColumns || [];
                    } else {
                        serviceItemsByCollection[collName] = [];
                        nonUserColumnsByCollection[collName] = [];
                    }
                } catch (e) {
                    serviceItemsByCollection[collName] = [];
                    nonUserColumnsByCollection[collName] = [];
                }
            }
        }

        // 載入班表中的所有人名和服事項目（只載入今天含以後的資料）
        async function loadSchedulePersons() {
            const allServiceItems = serviceItemsByCollection[targetCollection] || [];
            const nonUserCols = nonUserColumnsByCollection[targetCollection] || [];
            // 只統計非資訊欄位
            const userServiceItems = allServiceItems.filter(item => !nonUserCols.includes(item));

            // 取得當前週日字串（用於過濾）
            const currentSundayStr = formatDateString(getCurrentSunday());

            const snapshot = await getDocs(collection(db, targetCollection));
            schedulePersons = new Set();
            personServeItems = {};

            snapshot.forEach(docRef => {
                // 只處理今天（含）以後的班表
                if (docRef.id !== '_metadata' && docRef.id >= currentSundayStr) {
                    const data = docRef.data();
                    userServiceItems.forEach(item => {
                        if (data[item] && Array.isArray(data[item])) {
                            data[item].forEach(name => {
                                schedulePersons.add(name);
                                if (!personServeItems[name]) {
                                    personServeItems[name] = new Set();
                                }
                                personServeItems[name].add(item);
                            });
                        }
                    });
                }
            });
        }

        // 載入所有使用者
        async function loadUsers() {
            const snapshot = await getDocs(collection(db, 'users'));
            allUsers = {};

            snapshot.forEach(docRef => {
                allUsers[docRef.id] = docRef.data();
            });
        }

        // 檢查使用者是否需要更新（班表有未記錄的服事）
        function checkNeedsUpdate(name) {
            const userData = allUsers[name];
            if (!userData) return true; // 新使用者，需要加入

            // 檢查服事項目是否完整
            const scheduledServes = personServeItems[name] || new Set();
            const registeredServes = userData.serve_types?.[targetCollection] || [];

            for (const serve of scheduledServes) {
                if (!registeredServes.includes(serve)) {
                    return true; // 有缺少的服事
                }
            }
            return false;
        }

        // 渲染使用者列表
        function renderUserList(searchTerm = '') {
            const userList = document.getElementById('userList');

            // 合併：班表中的人 + 已註冊的人
            const allNames = new Set([...schedulePersons, ...Object.keys(allUsers)]);
            let usersArray = Array.from(allNames);


            // 排序：如果有 targetCollection，將「在此崇拜班表中」的人排在前面
            usersArray.sort((a, b) => {
                const aInSchedule = schedulePersons.has(a);
                const bInSchedule = schedulePersons.has(b);
                if (targetCollection) {
                    // 優先排序：在班表中的排前面
                    if (aInSchedule && !bInSchedule) return -1;
                    if (!aInSchedule && bInSchedule) return 1;
                }
                // 次要排序：按名稱排序
                return a.localeCompare(b, 'zh-TW');
            });

            // 搜尋過濾
            if (searchTerm) {
                usersArray = usersArray.filter(name =>
                    name.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            let needsUpdateCount = 0;
            let html = '';

            // 新增使用者卡片
            html += `
                <div class="user-card add-user-card" id="addUserCard">
                    ➕ 手動新增使用者
                </div>
            `;

            usersArray.forEach(name => {
                const userData = allUsers[name];
                const isNew = !userData;
                const isInSchedule = schedulePersons.has(name);
                const needsUpdate = checkNeedsUpdate(name);

                if (needsUpdate) needsUpdateCount++;

                // 取得服事項目
                let serveTags = '';
                if (userData && userData.serve_types && userData.serve_types[targetCollection]) {
                    serveTags = userData.serve_types[targetCollection]
                        .map(s => `<span class="serve-tag">${s}</span>`)
                        .join('');
                }

                // 取得其他崇拜資訊
                let otherServes = '';
                if (userData && userData.serve_types) {
                    const others = Object.keys(userData.serve_types)
                        .filter(c => c !== targetCollection && userData.serve_types[c].length > 0)
                        .map(c => SERVE_DISPLAY_NAMES[c] || c);
                    if (others.length > 0) {
                        otherServes = `<div style="margin-top: 4px; font-size: 11px; color: var(--text-light);">也在：${others.join('、')}</div>`;
                    }
                }

                // 檢查缺少的服事
                let missingServes = '';
                if (userData && isInSchedule) {
                    const scheduledServes = personServeItems[name] || new Set();
                    const registeredServes = userData.serve_types?.[targetCollection] || [];
                    const missing = Array.from(scheduledServes).filter(s => !registeredServes.includes(s));
                    if (missing.length > 0) {
                        missingServes = `<div style="margin-top: 4px; font-size: 11px; color: #f97316;">缺少：${missing.join('、')}</div>`;
                    }
                }

                const shouldHighlight = (isNew || needsUpdate);

                html += `
                    <div class="user-card ${shouldHighlight ? 'new-user' : ''}" data-name="${name}">
                        <div class="user-card-header">
                            <span class="user-card-name">${name}</span>
                            ${isNew ? '<span class="user-card-badge new">新使用者</span>' : ''}
                            ${!isNew && needsUpdate ? '<span class="user-card-badge new">需更新</span>' : ''}
                            ${userData && userData.lineId ? '<span class="user-card-badge linked">已綁定LINE</span>' : ''}
                            ${userData && !userData.lineId && userData.login_token ? `<button class="copy-invite-btn" data-token="${userData.login_token}" data-name="${name}" onclick="event.stopPropagation(); copyInviteLink(this)">📋 複製邀請碼</button>` : ''}
                        </div>
                        <div class="user-card-body">
                            ${isInSchedule ? '<div>📋 在此崇拜班表中</div>' : '<div style="color: var(--text-light);">不在此崇拜班表中</div>'}
                            ${serveTags ? `<div class="user-card-serve">${serveTags}</div>` : ''}
                            ${missingServes}
                            ${otherServes}
                        </div>
                    </div>
                `;
            });

            if (usersArray.length === 0 && !searchTerm) {
                html = `
                    <div class="user-card add-user-card" id="addUserCard">
                        ➕ 手動新增使用者
                    </div>
                    <div style="text-align: center; padding: 40px; color: var(--text-secondary);">沒有找到使用者</div>
                `;
            }

            userList.innerHTML = html;

            // 更新統計
            document.getElementById('totalUsers').textContent = usersArray.length;
            document.getElementById('newUsers').textContent = needsUpdateCount;

            // 綁定新增使用者卡片
            const addUserCard = document.getElementById('addUserCard');
            if (addUserCard) {
                addUserCard.addEventListener('click', openAddUserModal);
            }

            // 綁定卡片點擊事件
            document.querySelectorAll('.user-card:not(.add-user-card)').forEach(card => {
                card.addEventListener('click', () => {
                    const name = card.dataset.name;
                    openEditUserModal(name);
                });
            });
        }

        // 開啟新增使用者 Modal
        function openAddUserModal() {
            document.getElementById('newUserNameInput').value = '';
            document.getElementById('addUserModal').classList.remove('hidden');
            document.getElementById('newUserNameInput').focus();
        }

        // 開啟編輯使用者 Modal
        function openEditUserModal(name) {
            currentEditUser = name;
            const userData = allUsers[name];

            document.getElementById('editUserName').textContent = name;
            document.getElementById('lineIdInput').value = userData?.lineId || '';
            currentEditLoginToken = userData?.login_token || '';

            // 設定 alarm checkboxes
            const alarmTypes = userData?.alarm_type || [false, false, false, false, false, false];
            for (let i = 0; i < 6; i++) {
                document.getElementById(`alarm${i}`).checked = alarmTypes[i] || false;
            }

            // 設定 Line Bot ID 選擇器
            const lineBotId = userData?.line_bot_id ?? 0;
            document.querySelectorAll('.line-bot-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.value) === lineBotId);
            });

            // 複製 serve_types 到編輯用的變數
            currentEditServeTypes = JSON.parse(JSON.stringify(userData?.serve_types || {}));

            // 如果是新使用者，從班表取得服事項目
            if (!userData && personServeItems[name]) {
                currentEditServeTypes[targetCollection] = Array.from(personServeItems[name]);
            }

            // 顯示服事項目
            renderServeTypesDisplay();

            document.getElementById('editUserModal').classList.remove('hidden');
        }

        // 渲染服事項目顯示（只顯示有服事的崇拜）
        function renderServeTypesDisplay() {
            const container = document.getElementById('serveTypesDisplay');
            let html = '';

            // 取得有服事的崇拜
            const collectionsWithServes = VALID_COLLECTIONS.filter(collName => {
                const items = currentEditServeTypes[collName];
                return items && items.length >= 0;
            });

            // 如果沒有任何服事，顯示目前崇拜的空區塊
            if (collectionsWithServes.length === 0) {
                collectionsWithServes.push(targetCollection);
                currentEditServeTypes[targetCollection] = currentEditServeTypes[targetCollection] || [];
            }

            collectionsWithServes.forEach(collName => {
                const collDisplayName = SERVE_DISPLAY_NAMES[collName];
                const items = currentEditServeTypes[collName] || [];
                const availableItems = serviceItemsByCollection[collName] || [];

                html += `
                    <div class="serve-section" data-collection="${collName}">
                        <div class="serve-section-header">
                            <span class="serve-section-title">${collDisplayName}</span>
                        </div>
                        <div class="serve-items-container">
                            ${items.map(s => `
                                <span class="serve-item-tag">
                                    ${s}
                                    <button class="serve-item-remove" data-collection="${collName}" data-serve="${s}">×</button>
                                </span>
                            `).join('')}
                            <button class="add-serve-btn" data-collection="${collName}">+ 新增服事</button>
                        </div>
                    </div>
                `;
            });

            // 新增崇拜按鈕（顯示未使用的崇拜）
            const unusedCollections = VALID_COLLECTIONS.filter(c => !collectionsWithServes.includes(c));
            if (unusedCollections.length > 0) {
                html += `
                    <div style="margin-top: 8px;">
                        <button class="btn btn-secondary btn-sm" id="addCollectionBtn">
                            ➕ 新增其他崇拜服事
                        </button>
                    </div>
                `;
            }

            container.innerHTML = html;

            // 綁定刪除服事按鈕
            container.querySelectorAll('.serve-item-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const collName = btn.dataset.collection;
                    const serve = btn.dataset.serve;
                    removeServeItem(collName, serve);
                });
            });

            // 綁定新增服事按鈕
            container.querySelectorAll('.add-serve-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const collName = btn.dataset.collection;
                    showServeDropdown(btn, collName);
                });
            });

            // 綁定新增崇拜按鈕
            const addCollectionBtn = document.getElementById('addCollectionBtn');
            if (addCollectionBtn) {
                addCollectionBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showCollectionDropdown(addCollectionBtn);
                });
            }
        }

        // 移除服事項目
        function removeServeItem(collName, serve) {
            if (!currentEditServeTypes[collName]) return;
            const index = currentEditServeTypes[collName].indexOf(serve);
            if (index > -1) {
                currentEditServeTypes[collName].splice(index, 1);
            }
            // 如果該崇拜沒有服事了，移除整個崇拜
            if (currentEditServeTypes[collName].length === 0) {
                delete currentEditServeTypes[collName];
            }
            renderServeTypesDisplay();
        }

        // 顯示服事選擇下拉選單
        function showServeDropdown(btn, collName) {
            closeAllDropdowns();

            const availableItems = serviceItemsByCollection[collName] || [];
            const currentItems = currentEditServeTypes[collName] || [];

            if (availableItems.length === 0) {
                alert('此崇拜沒有服事項目');
                return;
            }

            const dropdown = document.createElement('div');
            dropdown.className = 'serve-dropdown';
            dropdown.id = 'activeDropdown';

            availableItems.forEach(item => {
                const isSelected = currentItems.includes(item);
                dropdown.innerHTML += `
                    <div class="serve-dropdown-item ${isSelected ? 'disabled' : ''}" 
                         data-serve="${item}" 
                         data-collection="${collName}"
                         ${isSelected ? '' : 'data-selectable="true"'}>
                        ${item} ${isSelected ? '(已加入)' : ''}
                    </div>
                `;
            });

            // 定位
            const rect = btn.getBoundingClientRect();
            dropdown.style.position = 'fixed';
            dropdown.style.left = rect.left + 'px';
            dropdown.style.top = (rect.bottom + 4) + 'px';

            document.body.appendChild(dropdown);

            // 綁定點擊事件
            dropdown.querySelectorAll('.serve-dropdown-item[data-selectable="true"]').forEach(item => {
                item.addEventListener('click', () => {
                    const serve = item.dataset.serve;
                    const coll = item.dataset.collection;
                    addServeItem(coll, serve);
                    closeAllDropdowns();
                });
            });

            // 點擊外部關閉
            setTimeout(() => {
                document.addEventListener('click', closeAllDropdowns, { once: true });
            }, 10);
        }

        // 顯示崇拜選擇下拉選單
        function showCollectionDropdown(btn) {
            closeAllDropdowns();

            // 已使用的崇拜：只要 key 存在就算已使用（包含空陣列）
            const usedCollections = Object.keys(currentEditServeTypes);
            const unusedCollections = VALID_COLLECTIONS.filter(c => !usedCollections.includes(c));

            if (unusedCollections.length === 0) return;

            const dropdown = document.createElement('div');
            dropdown.className = 'serve-dropdown';
            dropdown.id = 'activeDropdown';

            unusedCollections.forEach(collName => {
                dropdown.innerHTML += `
                    <div class="serve-dropdown-item" data-collection="${collName}">
                        ${SERVE_DISPLAY_NAMES[collName]}
                    </div>
                `;
            });

            // 定位
            const rect = btn.getBoundingClientRect();
            dropdown.style.position = 'fixed';
            dropdown.style.left = rect.left + 'px';
            dropdown.style.top = (rect.bottom + 4) + 'px';

            document.body.appendChild(dropdown);

            // 綁定點擊事件 - 使用 insertAdjacentHTML 並在之後綁定事件
            const items = dropdown.querySelectorAll('.serve-dropdown-item');
            items.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const collName = item.dataset.collection;
                    currentEditServeTypes[collName] = [];
                    renderServeTypesDisplay();
                    closeAllDropdowns();
                });
            });

            // 點擊外部關閉
            setTimeout(() => {
                document.addEventListener('click', closeAllDropdowns, { once: true });
            }, 10);
        }

        // 新增服事項目
        function addServeItem(collName, serve) {
            if (!currentEditServeTypes[collName]) {
                currentEditServeTypes[collName] = [];
            }
            if (!currentEditServeTypes[collName].includes(serve)) {
                currentEditServeTypes[collName].push(serve);
            }
            renderServeTypesDisplay();
        }

        // 關閉所有下拉選單
        function closeAllDropdowns() {
            const dropdown = document.getElementById('activeDropdown');
            if (dropdown) {
                dropdown.remove();
            }
        }

        // 關閉 Modal
        window.closeModal = function (modalId) {
            document.getElementById(modalId).classList.add('hidden');
            currentEditUser = null;
            currentEditServeTypes = {};
            closeAllDropdowns();
        };

        // 設定事件監聽器
        function setupEventListeners() {
            // 自動加入使用者 & 更新服事
            document.getElementById('autoAddUsersBtn').addEventListener('click', autoAddAndUpdateUsers);

            // 匯出 Excel
            document.getElementById('exportExcelBtn').addEventListener('click', exportToExcel);

            // 搜尋
            document.getElementById('searchBox').addEventListener('input', (e) => {
                renderUserList(e.target.value);
            });

            // 儲存使用者
            document.getElementById('saveUserBtn').addEventListener('click', saveUser);

            // 刪除使用者
            document.getElementById('deleteUserBtn').addEventListener('click', deleteUser);

            // 確認新增使用者
            document.getElementById('confirmAddUserBtn').addEventListener('click', confirmAddUser);

            // Enter 鍵新增使用者
            document.getElementById('newUserNameInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    confirmAddUser();
                }
            });

            // Line Bot ID 選擇器
            document.querySelectorAll('.line-bot-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.line-bot-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
        }

        // 複製邀請連結
        window.copyInviteLink = async function (btn) {
            const token = btn.dataset.token;
            const name = btn.dataset.name;

            try {
                await navigator.clipboard.writeText(token);
                btn.textContent = '✅ 已複製！';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = '📋 複製邀請碼';
                    btn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                // 備用方案
                const textarea = document.createElement('textarea');
                textarea.value = token;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                btn.textContent = '✅ 已複製！';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = '📋 複製邀請碼';
                    btn.classList.remove('copied');
                }, 2000);
            }
        };

        // 匯出 Excel
        function exportToExcel() {
            const users = Object.entries(allUsers);
            if (users.length === 0) {
                alert('沒有使用者資料可以匯出');
                return;
            }

            // 建立 CSV 內容（Excel 可以直接開啟）
            let csvContent = '\uFEFF'; // BOM for UTF-8
            csvContent += '使用者名稱,邀請碼,已綁定LINE\n';

            users.forEach(([name, data]) => {
                const token = data.login_token || '';
                const hasLine = data.lineId ? '是' : '否';
                // 處理可能包含逗號的欄位
                csvContent += `"${name}","${token}","${hasLine}"\n`;
            });

            // 建立下載連結
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `使用者邀請碼_${new Date().toISOString().slice(0, 10)}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // 確認新增使用者
        async function confirmAddUser() {
            const name = document.getElementById('newUserNameInput').value.trim();

            if (!name) {
                alert('請輸入使用者名稱');
                return;
            }

            if (allUsers[name]) {
                alert('此使用者已存在');
                return;
            }

            try {
                const userData = {
                    alarm_type: [false, false, false, false, false, false],
                    lineId: '',
                    login_token: generateLoginToken(),
                    serve_types: {},
                    line_bot_id: 0,
                    usage_count: {}
                };

                await setDoc(doc(db, 'users', name), userData);
                allUsers[name] = userData;

                closeModal('addUserModal');
                renderUserList(document.getElementById('searchBox').value);

                // 開啟編輯 modal
                openEditUserModal(name);

            } catch (error) {
                console.error('新增使用者失敗:', error);
                alert('新增失敗：' + error.message);
            }
        }

        // 自動加入使用者 & 更新服事
        async function autoAddAndUpdateUsers() {
            // 找出需要處理的使用者
            const usersToProcess = Array.from(schedulePersons).filter(name => {
                const userData = allUsers[name];
                if (!userData) return true; // 新使用者

                // 檢查是否有缺少的服事
                const scheduledServes = personServeItems[name] || new Set();
                const registeredServes = userData.serve_types?.[targetCollection] || [];
                for (const serve of scheduledServes) {
                    if (!registeredServes.includes(serve)) {
                        return true;
                    }
                }
                return false;
            });

            if (usersToProcess.length === 0) {
                alert('沒有需要處理的使用者！');
                return;
            }

            const newUsers = usersToProcess.filter(name => !allUsers[name]);
            const updateUsers = usersToProcess.filter(name => allUsers[name]);

            let message = `即將處理 ${usersToProcess.length} 位使用者：`;
            if (newUsers.length > 0) {
                message += `\n- 新增 ${newUsers.length} 位`;
            }
            if (updateUsers.length > 0) {
                message += `\n- 更新 ${updateUsers.length} 位`;
            }
            message += '\n\n確定要執行嗎？';

            if (!confirm(message)) {
                return;
            }

            try {
                for (const name of usersToProcess) {
                    const scheduledServes = Array.from(personServeItems[name] || new Set());
                    let userData = allUsers[name];

                    if (!userData) {
                        // 新使用者
                        userData = {
                            alarm_type: [false, false, false, false, false, false],
                            lineId: '',
                            login_token: generateLoginToken(),
                            serve_types: {
                                [targetCollection]: scheduledServes
                            }
                        };
                    } else {
                        // 現有使用者，合併服事
                        if (!userData.serve_types) {
                            userData.serve_types = {};
                        }
                        const existingServes = userData.serve_types[targetCollection] || [];
                        const mergedServes = [...new Set([...existingServes, ...scheduledServes])];
                        userData.serve_types[targetCollection] = mergedServes;
                    }

                    await setDoc(doc(db, 'users', name), userData);
                    allUsers[name] = userData;
                }

                alert(`處理完成！\n- 新增 ${newUsers.length} 位\n- 更新 ${updateUsers.length} 位`);
                renderUserList();

            } catch (error) {
                console.error('自動處理使用者失敗:', error);
                alert('處理失敗：' + error.message);
            }
        }

        // 儲存使用者
        async function saveUser() {
            if (!currentEditUser) return;

            try {
                const lineId = document.getElementById('lineIdInput').value.trim();
                const alarmType = [];
                for (let i = 0; i < 6; i++) {
                    alarmType.push(document.getElementById(`alarm${i}`).checked);
                }

                // 取得選中的 Line Bot ID
                const activeBtn = document.querySelector('.line-bot-btn.active');
                const lineBotId = activeBtn ? parseInt(activeBtn.dataset.value) : 0;

                // 清理空的崇拜
                const cleanedServeTypes = {};
                for (const [collName, items] of Object.entries(currentEditServeTypes)) {
                    if (items && items.length > 0) {
                        cleanedServeTypes[collName] = items;
                    }
                }

                // 保留原有的 usage_count
                const existingUserData = allUsers[currentEditUser] || {};
                const userData = {
                    alarm_type: alarmType,
                    lineId: lineId,
                    login_token: currentEditLoginToken || generateLoginToken(),
                    serve_types: cleanedServeTypes,
                    line_bot_id: lineBotId,
                    usage_count: existingUserData.usage_count || {}
                };

                await setDoc(doc(db, 'users', currentEditUser), userData);
                allUsers[currentEditUser] = userData;

                closeModal('editUserModal');
                renderUserList(document.getElementById('searchBox').value);

            } catch (error) {
                console.error('儲存使用者失敗:', error);
                alert('儲存失敗：' + error.message);
            }
        }

        // 刪除使用者
        async function deleteUser() {
            if (!currentEditUser) return;

            if (!confirm(`確定要刪除使用者「${currentEditUser}」嗎？`)) {
                return;
            }

            try {
                await deleteDoc(doc(db, 'users', currentEditUser));
                delete allUsers[currentEditUser];

                closeModal('editUserModal');
                renderUserList(document.getElementById('searchBox').value);

            } catch (error) {
                console.error('刪除使用者失敗:', error);
                alert('刪除失敗：' + error.message);
            }
        }

        init();
    </script>
    <script src="../orientation-lock.js"></script>
</body>

</html>
