<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教會服事班表系統</title>
  <link rel="stylesheet" href="../styles.css">
</head>

<body>
  <!-- Agent 兩欄佈局 -->
  <div class="agent-layout">

    <!-- 左側：主要排班表區域 -->
    <div class="agent-main-area">
      <div class="app-container">
        <!-- 頂部控制區 -->
        <div class="header-section">
          <div class="app-title">
            <a href="index.html" class="btn btn-secondary" style="margin-right: 12px; padding: 6px 12px;">← 返回</a>
            <h1 style="display: inline;">⛪ <span id="collectionTitle">教會服事班表</span></h1>
          </div>

          <div class="control-actions compact">
            <button class="btn btn-secondary" id="showPastBtn" style="display: none;" onclick="togglePastData()">
              📅顯示歷史
            </button>
            <div class="btn-group">
              <button class="btn btn-secondary btn-group-left" id="undoBtn" title="上一步 (Ctrl+Z)" disabled>
                ⬅️上一步
              </button>
              <button class="btn btn-secondary btn-group-right" id="redoBtn" title="下一步 (Ctrl+Y)" disabled>
                下一步➡️
              </button>
            </div>
            <button class="btn btn-secondary" id="addColumnBtn">
              ✨新增服事/資訊
            </button>
            <button class="btn btn-secondary" id="editDisplayConfigBtn">
              📊編輯顯示欄位
            </button>
            <button class="btn btn-secondary" id="viewLogsBtn">
              📜編輯記錄
            </button>
            <button class="btn btn-secondary btn-with-badge" id="manageUsersBtn">
              👥管理使用者
              <span class="badge-alert hidden" id="userAlertBadge">!</span>
            </button>
            <button class="btn btn-primary" id="toggleSidebarBtn" title="開關AI側邊欄">
              🤖AI
            </button>
          </div>

          <div class="status-indicator">
            <div class="text-muted" id="statusText">載入中...</div>
          </div>
        </div>

        <!-- 通用輸入 Modal（新增服事 / 新增資訊欄位） -->
        <div class="modal-overlay hidden" id="addColumnModal">
          <div class="modal" style="max-width: 420px;">
            <div class="modal-header">
              <h2>✨新增欄位</h2>
              <button class="modal-close" onclick="closeModal('addColumnModal')">&times;</button>
            </div>
            <div class="modal-body">
              <!-- 類型選擇 radio btn-group -->
              <div class="form-group" style="margin-bottom: 16px;">
                <label style="display:block; margin-bottom:8px; font-weight:600;">類型</label>
                <div class="btn-group" style="width:100%;">
                  <label class="btn btn-secondary btn-group-left addcol-type-btn" id="addColTypeServiceBtn"
                    style="flex:1; text-align:center; cursor:pointer; margin:0;">
                    <input type="radio" name="addColType" value="service" checked
                      style="position:absolute; opacity:0; width:0;" id="addColTypeService">
                    ✨服事項目
                  </label>
                  <label class="btn btn-secondary btn-group-right addcol-type-btn" id="addColTypeInfoBtn"
                    style="flex:1; text-align:center; cursor:pointer; margin:0;">
                    <input type="radio" name="addColType" value="info" style="position:absolute; opacity:0; width:0;"
                      id="addColTypeInfo">
                    📝資訊欄位
                  </label>
                </div>
              </div>
              <!-- 名稱輸入 -->
              <div class="form-group">
                <label id="addColumnModalLabel">名稱</label>
                <input type="text" class="form-control" id="addColumnInput" placeholder="請輸入名稱..." autocomplete="off">
                <div class="form-hint text-muted" style="margin-top: 6px; font-size: 12px;">
                  名稱不能包含 <code>|</code> 符號
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="closeModal('addColumnModal')">取消</button>
              <button class="btn btn-primary" id="addColumnConfirmBtn">新增</button>
            </div>
          </div>
        </div>

        <!-- Review 操作列 -->
        <div class="agent-review-bar hidden" id="agentReviewBar">
          <span class="agent-review-label">🤖 Agent 提案審核中</span>
          <div class="agent-review-actions">
            <button class="btn btn-success btn-sm" id="acceptAllBtn">✅ 全部接受</button>
            <button class="btn btn-danger btn-sm" id="rejectAllBtn">❌ 全部拒絕</button>
          </div>
        </div>

        <!-- 表格容器 -->
        <div class="table-container">
          <div class="table-scroll" style="overflow-x: auto;">
            <table class="schedule-table" id="scheduleTable">
              <thead id="tableHead">
                <!-- 動態生成 -->
              </thead>
              <tbody id="tableBody">
                <!-- 動態生成 -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- 右鍵選單 -->
        <div class="context-menu hidden" id="contextMenu">
          <div class="context-menu-item" id="contextMenuCopy">📄 複製</div>
          <div class="context-menu-item" id="contextMenuCut">✂️ 剪下</div>
          <div class="context-menu-item" id="contextMenuPaste">📋 從此格貼上</div>
        </div>

        <!-- 貼上預覽 Modal -->
        <div class="modal-overlay hidden" id="pastePreviewModal">
          <div class="modal" style="max-width: 850px;">
            <div class="modal-header">
              <h2>📋 貼上預覽</h2>
              <button class="modal-close" onclick="closeModal('pastePreviewModal')">&times;</button>
            </div>
            <div class="modal-body">
              <div class="separator-options">
                <span class="separator-label">人名分隔符：</span>
                <label class="separator-option"><input type="radio" name="pasteSeparator" value="/" checked>
                  <code>/</code>
                  斜線</label>
                <label class="separator-option"><input type="radio" name="pasteSeparator" value="+"> <code>+</code>
                  加號</label>
                <label class="separator-option"><input type="radio" name="pasteSeparator" value=","> <code>,</code>
                  半形逗號</label>
                <label class="separator-option"><input type="radio" name="pasteSeparator" value="，"> <code>，</code>
                  全形逗號</label>
                <label class="separator-option"><input type="radio" name="pasteSeparator" value=" "> 空格</label>
                <label class="separator-option"><input type="radio" name="pasteSeparator" value=""> 無分隔</label>
              </div>
              <div id="pastePreviewContent" style="overflow-x: auto; margin-top: 12px;"></div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="closeModal('pastePreviewModal')">取消</button>
              <button class="btn btn-primary" id="confirmPasteBtn">確認匯入</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 編輯服事項目對話框 -->
      <div class="modal-overlay hidden" id="editServiceModal">
        <div class="modal">
          <div class="modal-header">
            <h2>編輯服事項目</h2>
            <button class="modal-close" onclick="closeModal('editServiceModal')">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label>服事項目名稱</label>
              <input type="text" class="form-control" id="serviceNameInput" placeholder="請輸入服事項目名稱">
            </div>
            <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
              <input type="checkbox" id="isInfoColumnCheckbox" style="width: 18px; height: 18px; cursor: pointer;">
              <label for="isInfoColumnCheckbox" style="margin: 0; cursor: pointer;">這是資訊欄位（不包含人名）</label>
            </div>
          </div>
          <div class="modal-footer" style="justify-content: space-between;">
            <button class="btn btn-danger" id="deleteServiceBtn">移除服事項目</button>
            <div style="display: flex; gap: 16px;">
              <button class="btn btn-secondary" onclick="closeModal('editServiceModal')">取消</button>
              <button class="btn btn-primary" id="saveServiceBtn">儲存</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 編輯人員對話框 -->
      <div class="modal-overlay hidden" id="editPersonModal">
        <div class="modal">
          <div class="modal-header">
            <div>
              <h2>編輯服事人員</h2>
              <div class="modal-subtitle" id="editPersonModalSubtitle">
                <!-- 動態顯示日期和服事項目 -->
              </div>
            </div>
            <button class="modal-close" onclick="closeModal('editPersonModal')">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label>選擇現有人員或輸入新人員</label>
              <div class="person-select-container" id="personSelectContainer">
                <!-- 動態生成的現有人員積木 -->
                <div class="person-chips-select" id="personDropdown">
                  <!-- 動態生成 -->
                </div>
                <!-- 輸入新人員的空白積木 -->
                <div class="person-chip-input-wrapper">
                  <input type="text" class="person-chip-input" id="newPersonInput" placeholder="輸入新姓名...">
                  <button class="person-chip-input-btn" id="addPersonChipBtn">+</button>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label>目前服事人員</label>
              <div class="person-chips" id="currentPersonChips">
                <!-- 動態生成 -->
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" onclick="closeModal('editPersonModal')">完成</button>
          </div>
        </div>
      </div>

      <!-- 編輯顯示欄位對話框 -->
      <div class="modal-overlay hidden" id="displayConfigModal">
        <div class="modal" style="max-width: 800px; max-height: 80vh;">
          <div class="modal-header">
            <h2>📊 編輯顯示欄位</h2>
            <button class="modal-close" onclick="closeModal('displayConfigModal')">&times;</button>
          </div>
          <div class="modal-body" style="overflow-y: auto; max-height: 60vh;">
            <div id="displayConfigGroups" class="display-config-groups">
              <!-- 動態生成 -->
            </div>
            <div class="add-group-section">
              <button class="btn btn-secondary" id="addGroupBtn" style="width: 100%;">
                ➕ 新增群組
              </button>
            </div>
            <div class="hidden-zone" id="hiddenZone">
              <div class="hidden-zone-title">🚫 不顯示區域 (拖入此處的項目會隱藏)</div>
              <div class="hidden-zone-items" id="hiddenZoneItems">
                <!-- 動態生成 -->
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('displayConfigModal')">取消</button>
            <button class="btn btn-primary" id="saveDisplayConfigBtn">儲存設定</button>
          </div>
        </div>
      </div>
      <!-- 通用確認 Modal -->
      <div class="modal-overlay hidden" id="confirmModal">
        <div class="modal" style="max-width: 400px;">
          <div class="modal-header">
            <h2 id="confirmModalTitle">確認操作</h2>
            <button class="modal-close" onclick="closeModal('confirmModal')">&times;</button>
          </div>
          <div class="modal-body">
            <p id="confirmModalMessage" style="margin: 0; line-height: 1.5;"></p>
          </div>
          <div class="modal-footer"
            style="padding-top: 12px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 12px;">
            <button class="btn btn-secondary" onclick="closeModal('confirmModal')">取消</button>
            <button class="btn btn-danger" id="confirmModalBtn">確認</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 可拖曳分隔線 -->
    <div class="agent-resizer collapsed" id="agentResizer" title="拖曳調整寬度"></div>

    <!-- 右側：Agent 側邊欄 -->
    <div class="agent-sidebar collapsed" id="agentSidebar">
      <div class="agent-sidebar-header">
        <h3>🤖 AI 助手</h3>
        <button class="agent-sidebar-close" id="closeSidebarBtn">&times;</button>
      </div>

      <!-- 模式選擇 -->
      <div class="agent-config-section"
        style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <label class="agent-config-label" style="margin-bottom: 0; white-space: nowrap;">模式選擇</label>
        <select class="agent-select" id="modeSelect" style="flex: 1; margin: 0; padding: 6px 10px;">
          <option value="edit_qa" selected>編輯 / 問答</option>
          <option value="scheduling">排班</option>
        </select>
      </div>

      <!-- 規則勾選區 -->
      <div class="agent-config-section" id="agentRulesSection">
        <label class="agent-config-label" id="agentRulesToggle"
          style="cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none;">
          排班規則
          <span id="agentRulesIcon" style="font-size: 10px; color: #64748b;">▼</span>
        </label>
        <div class="agent-rules" id="agentRulesContent">
          <label class="agent-rule-option">
            <input type="checkbox" id="ruleConsecutive" checked>
            <span>禁止連續同服事</span>
            <input type="number" id="ruleConsecutiveWeeks" min="2" value="2" max="3"
              style="width: 64px; margin-left: 8px; padding: 2px 6px;">
            <span>週</span>
          </label>
          <label class="agent-rule-option">
            <input type="checkbox" id="ruleMaxRoles" checked>
            <span>同工單週最多</span>
            <input type="number" id="ruleMaxRolesLimit" min="1" value="2" max="3"
              style="width: 64px; margin-left: 8px; padding: 2px 6px;">
            <span>項服事</span>
          </label>
          <label class="agent-rule-option">
            <input type="checkbox" id="ruleServiceKnownPeople" checked>
            <span>僅使用該服事歷史人員</span>
          </label>
        </div>
      </div>

      <!-- 聊天對話區域 -->
      <div class="agent-chat-area" id="agentChatArea">
        <div class="agent-chat-welcome">
          <div class="agent-chat-welcome-icon">🤖</div>
          <p>嗨！我是 AI 助手。</p>
          <p>請告訴我你想如何排班，我會產生建議供你審核。</p>
          <p class="agent-chat-hint" id="agentChatHint">💡 你可以上傳 CSV 檔案作為排班參考資料。</p>
        </div>
      </div>

      <!-- 輸入區域 -->
      <div class="agent-input-area">
        <!-- 附件提示 -->
        <div class="agent-attachment-preview hidden" id="attachmentPreview">
          <span class="agent-attachment-name" id="attachmentName"></span>
          <button class="agent-attachment-remove" id="removeAttachmentBtn">&times;</button>
        </div>
        <!-- 輸入框和按鈕 -->
        <div class="agent-input-row">
          <label class="agent-attach-btn" id="csvAttachBtn" title="上傳 CSV 檔案">
            📎
            <input type="file" accept=".csv" id="csvFileInput" style="display: none;">
          </label>
          <textarea class="agent-prompt-input" id="agentPromptInput" placeholder="輸入排班指令..." rows="1"></textarea>
          <button class="agent-send-btn" id="agentSendBtn" title="送出">
            <span>➤</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script type="module">
    console.log('🚀 開始初始化 Firebase...');

    // 引入 Firebase
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js';
    import { getFirestore, collection, doc, getDocs, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, where, limit, writeBatch } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    // 引入配置
    import { firebaseConfig, RECAPTCHA_SITE_KEY, AGENT_API_URL } from '../firebase-config.js';

    // 從 URL 參數取得 collection 名稱
    const urlParams = new URLSearchParams(window.location.search);
    const collectionName = urlParams.get('collection') || '';

    // 顯示錯誤頁面
    function escapeHtml(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showError(title, message) {
      document.querySelector('.agent-main-area .app-container').innerHTML = `
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center;">
          <h1 style="color: #ef4444; font-size: 48px; margin-bottom: 16px;">⚠️</h1>
          <h2 style="color: #ef4444; margin-bottom: 8px;">${escapeHtml(title)}</h2>
          <p style="color: #64748b;">${escapeHtml(message)}</p>
          <a href="index.html" class="btn btn-primary" style="margin-top: 24px;">返回選擇頁面</a>
        </div>
      `;
    }

    // 載入崇拜列表並驗證
    async function loadAndValidateCollection(db) {
      const { doc, getDoc } = window.firestore;
      const serveListRef = doc(db, '_config', 'serve-list');
      const serveListDoc = await getDoc(serveListRef);

      if (!serveListDoc.exists()) {
        showError('尚未設定', '請先到管理頁面新增崇拜');
        return null;
      }

      const serveList = serveListDoc.data().serves || [];
      if (serveList.length === 0) {
        showError('尚未設定', '請先到管理頁面新增崇拜');
        return null;
      }

      const serve = serveList.find(s => s.id === collectionName);
      if (!serve) {
        showError('找不到班表', `無效的班表名稱: ${collectionName || '(未指定)'}`);
        return null;
      }

      return serve;
    }

    // 更新頁面標題
    function updatePageTitle(serve) {
      document.getElementById('collectionTitle').textContent = serve.name + '班表';
      document.title = `${serve.name}班表 - 教會服事班表系統`;
    }

    // 記錄進入頁面的時間
    const sessionStartTime = new Date();
    const formatSessionTime = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const h = String(date.getHours()).padStart(2, '0');
      const min = String(date.getMinutes()).padStart(2, '0');
      const sec = String(date.getSeconds()).padStart(2, '0');
      return `${y}.${m}.${d}.${h}.${min}.${sec}`;
    };
    window.SESSION_START_TIME = formatSessionTime(sessionStartTime);

    console.log('📝 Firebase 配置:', {
      projectId: firebaseConfig.projectId,
      authDomain: firebaseConfig.authDomain,
      collectionName: collectionName
    });

    // 初始化 Firebase
    (async function initFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        console.log('✅ Firebase App 初始化成功');

        const appCheck = initializeAppCheck(app, {
          provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
          isTokenAutoRefreshEnabled: true
        });

        const db = getFirestore(app);
        console.log('✅ Firestore 連接成功');

        window.db = db;
        window.firestore = { collection, doc, getDocs, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, where, limit, writeBatch };
        window.COLLECTION_NAME = collectionName;
        window.AGENT_API_URL = AGENT_API_URL;

        console.log('✅ Firebase 全域變數已設定');

        const serve = await loadAndValidateCollection(db);
        if (!serve) return;

        updatePageTitle(serve);

        // 載入應用程式
        import('./app.js').then(() => {
          console.log('✅ app.js 已載入');
        }).catch(error => {
          console.error('❌ 載入應用程式失敗:', error);
          document.getElementById('statusText').textContent = '載入失敗，請檢查 Firebase 配置';
        });
      } catch (error) {
        console.error('❌ Firebase 初始化失敗:', error);
        console.error('錯誤詳情:', {
          name: error.name,
          message: error.message,
          code: error.code
        });
        document.getElementById('statusText').textContent = 'Firebase 初始化失敗';
        alert(`Firebase 初始化失敗：${error.message}\n\n請檢查 firebase-config.js 中的配置是否正確。`);
      }
    })();
  </script>

</body>

</html>
