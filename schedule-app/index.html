<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教會服事班表</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .selection-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        .selection-title {
            text-align: center;
            margin-bottom: 48px;
        }

        .selection-title h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .selection-title p {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .collection-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            max-width: 1100px;
        }

        .collection-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 48px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-md);
            min-width: 200px;
        }

        .collection-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }

        .collection-card .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .collection-card .name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .collection-card .description {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .readonly-badge {
            background: #e2e8f0;
            color: #64748b;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            display: inline-block;
            margin-top: 8px;
        }

        .loading-message {
            text-align: center;
            color: var(--text-secondary);
            font-size: 16px;
        }

        .error-page {
            text-align: center;
            padding: 60px;
        }

        .error-page .error-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .error-page h2 {
            color: #dc2626;
            margin-bottom: 8px;
        }

        .error-page p {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
    </style>
</head>

<body>
    <div class="selection-page" id="mainPage">
        <div class="selection-title">
            <h1>📖 <span id="userName"></span> 的服事班表</h1>
            <p>請選擇要查看的班表</p>
        </div>

        <div class="collection-cards" id="collectionCards">
            <div class="loading-message">載入中...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { firebaseConfig, RECAPTCHA_SITE_KEY } from './firebase-config.js';

        // 從 URL 取得 user 參數
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('user');

        let serveList = [];
        let userServeTypes = {}; // 使用者有服事的崇拜

        function escapeHtml(value = '') {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 顯示錯誤頁面
        function showError(title, message) {
            document.getElementById('mainPage').innerHTML = `
                <div class="error-page">
                    <div class="error-icon">⚠️</div>
                    <h2>${escapeHtml(title)}</h2>
                    <p>${escapeHtml(message)}</p>
                </div>
            `;
        }

        async function init() {
            try {
                // 檢查是否有 user 參數
                if (!userName) {
                    showError('缺少使用者', '請提供使用者名稱（網址需包含 ?user=名稱）');
                    return;
                }

                const app = initializeApp(firebaseConfig);

                // 初始化 App Check
                const appCheck = initializeAppCheck(app, {
                    provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
                    isTokenAutoRefreshEnabled: true
                });

                const db = getFirestore(app);

                // 檢查使用者是否存在
                const userRef = doc(db, 'users', userName);
                const userDoc = await getDoc(userRef);

                if (!userDoc.exists()) {
                    showError('找不到使用者', `使用者「${userName}」不存在`);
                    return;
                }

                // 取得使用者的 serve_types
                const userData = userDoc.data();
                userServeTypes = userData.serve_types || {};

                // 取得使用者有服事的崇拜 ID 列表
                const userServeIds = Object.keys(userServeTypes).filter(
                    key => Array.isArray(userServeTypes[key]) && userServeTypes[key].length > 0
                );

                if (userServeIds.length === 0) {
                    showError('尚無服事', `使用者「${userName}」目前沒有任何服事項目`);
                    return;
                }

                // 載入 serve-list
                const serveListRef = doc(db, '_config', 'serve-list');
                const serveListDoc = await getDoc(serveListRef);

                if (serveListDoc.exists()) {
                    const allServes = serveListDoc.data().serves || [];
                    // 只顯示使用者有服事的崇拜
                    serveList = allServes.filter(serve => userServeIds.includes(serve.id));
                } else {
                    serveList = [];
                }

                // 如果使用者只有一個崇拜，直接跳轉到該崇拜頁面
                if (serveList.length === 1) {
                    const serve = serveList[0];
                    const viewUrl = `view.html?service=${encodeURIComponent(serve.name)}&user=${encodeURIComponent(userName)}`;
                    window.location.href = viewUrl;
                    return;
                }

                // 更新頁面標題
                document.getElementById('userName').textContent = userName;

                renderCollectionCards();

            } catch (error) {
                console.error('初始化失敗:', error);
                document.getElementById('collectionCards').innerHTML =
                    '<div class="loading-message">載入失敗，請檢查網路連線</div>';
            }
        }

        function renderCollectionCards() {
            const container = document.getElementById('collectionCards');

            if (serveList.length === 0) {
                container.innerHTML = '<div class="loading-message">尚無可用的班表</div>';
                return;
            }

            let html = '';
            serveList.forEach(serve => {
                // 傳遞 service（崇拜名稱）和 user 參數到 view.html
                const viewUrl = `view.html?service=${encodeURIComponent(serve.name)}&user=${encodeURIComponent(userName)}`;
                const safeEmoji = escapeHtml(serve.emoji);
                const safeName = escapeHtml(serve.name);
                html += `
                    <div class="collection-card" onclick="window.location.href='${viewUrl}'">
                        <div class="icon">${safeEmoji}</div>
                        <div class="name">${safeName}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        init();
    </script>
</body>

</html>
