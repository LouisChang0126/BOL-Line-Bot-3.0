<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助手記錄</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
    <link rel="shortcut icon" href="../favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .admin-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            flex: 1;
        }

        .refresh-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .refresh-btn:hover {
            background: var(--primary-dark);
        }

        /* ===== 統計卡片 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .stat-card.wide {
            grid-column: span 2;
        }

        .stat-card-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-card-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            font-family: 'Segoe UI', system-ui;
        }

        .stat-card-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .stat-bar-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .stat-bar-row {
            display: flex;
            align-items: center;
            font-size: 12px;
            gap: 8px;
        }

        .stat-bar-label {
            min-width: 80px;
            color: var(--text-primary);
        }

        .stat-bar-track {
            flex: 1;
            height: 8px;
            background: #f1f5f9;
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            background: var(--primary-color);
            border-radius: 4px;
        }

        .stat-bar-fill.scheduling { background: #3b82f6; }
        .stat-bar-fill.edit_qa { background: #8b5cf6; }
        .stat-bar-fill.anthropic { background: #d97706; }
        .stat-bar-fill.openai_compatible { background: #10b981; }
        .stat-bar-fill.gemini { background: #06b6d4; }

        .stat-bar-count {
            min-width: 36px;
            text-align: right;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        /* ===== 篩選列 ===== */
        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .serve-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .serve-filter select {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            background: white;
            cursor: pointer;
        }

        .badge-serve {
            background: #ecfdf5;
            color: #047857;
        }

        .filter-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border-color);
            background: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.18s;
        }

        .filter-tab:hover {
            background: var(--bg-hover);
        }

        .filter-tab.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .filter-tab.active.tab-scheduling {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .filter-tab.active.tab-edit_qa {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }

        .filter-tab.active.tab-failed {
            background: #ef4444;
            border-color: #ef4444;
        }

        /* ===== 列表 ===== */
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
        }

        .log-card.failed {
            border-left: 4px solid #ef4444;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .log-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .log-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 500;
            margin-right: 6px;
        }

        .badge-mode-scheduling { background: #dbeafe; color: #2563eb; }
        .badge-mode-edit_qa { background: #f3e8ff; color: #7c3aed; }
        .badge-status-ok { background: #dcfce7; color: #16a34a; }
        .badge-status-fail { background: #fee2e2; color: #dc2626; }
        .badge-provider { background: #f1f5f9; color: #475569; }
        .badge-truncated { background: #fef3c7; color: #b45309; }
        .badge-thinking { background: #ede9fe; color: #6d28d9; }

        .log-prompt-preview {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .toggle-btn:hover {
            background: var(--bg-hover);
        }

        .detail-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
            display: none;
        }

        .detail-section.open {
            display: block;
        }

        .detail-block {
            margin-bottom: 16px;
        }

        .detail-block-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .detail-block pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.5;
            max-height: 360px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .detail-block .message-row {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .message-role {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .message-content {
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-primary);
        }

        .truncate-warning {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #92400e;
        }

        .no-logs {
            text-align: center;
            color: var(--text-secondary);
            padding: 60px 20px;
        }

        .load-more-wrap {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .load-more-btn {
            padding: 10px 24px;
            border-radius: 10px;
            background: white;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
        }

        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 模型定價面板 ===== */
        .pricing-panel {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            display: none;
        }

        .pricing-panel.open {
            display: block;
        }

        .pricing-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .pricing-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .pricing-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .pricing-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .pricing-table th,
        .pricing-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .pricing-table th {
            font-weight: 600;
            color: var(--text-secondary);
            background: #f8fafc;
        }

        .pricing-table input[type="number"] {
            width: 90px;
            padding: 4px 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .exchange-rate-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
        }

        .exchange-rate-row label {
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .exchange-rate-row input[type="number"] {
            width: 100px;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .exchange-rate-row .hint {
            color: var(--text-secondary);
            font-size: 12px;
            margin-left: auto;
        }

        .pricing-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .badge-cost {
            background: #fffbeb;
            color: #b45309;
        }

        /* ===== Schedule Data 區塊 / 表格 / Thinking ===== */
        .schedule-block {
            margin-top: 12px;
        }

        .view-toggle {
            display: inline-flex;
            gap: 4px;
            margin-left: 8px;
        }

        .view-toggle button {
            padding: 4px 10px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-size: 12px;
            border-radius: 6px;
            color: var(--text-secondary);
        }

        .view-toggle button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .schedule-table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 420px;
        }

        .schedule-table {
            border-collapse: collapse;
            font-size: 12px;
            min-width: 100%;
        }

        .schedule-table th,
        .schedule-table td {
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            text-align: left;
            vertical-align: top;
            white-space: nowrap;
        }

        .schedule-table th {
            background: #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 1;
            font-weight: 600;
        }

        .schedule-table td.date-cell {
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
            background: #fafafa;
        }

        .thinking-pre {
            background: #1e1b4b;
            color: #ddd6fe;
        }
    </style>
</head>

<body>
    <div class="admin-page">
        <div class="page-header">
            <a href="index.html" class="btn btn-secondary" style="padding: 6px 12px;">← 返回</a>
            <h1>🤖 AI 助手記錄</h1>
            <button class="refresh-btn" id="pricingBtn" style="background:#fbbf24;">💵 模型定價</button>
            <button class="refresh-btn" id="refreshBtn">🔄 刷新</button>
        </div>

        <div class="pricing-panel" id="pricingPanel">
            <div class="pricing-header">
                <h2>💵 模型定價（USD / 1M tokens）</h2>
            </div>
            <div class="pricing-hint">
                估計花費 = (input_tokens × input 單價 + output_tokens × output 單價) / 1,000,000，再以匯率換算成台幣。<br>
                資料儲存於瀏覽器 localStorage，僅你本機可見。
            </div>
            <div class="exchange-rate-row">
                <label for="exchangeRateInput">USD → TWD 匯率</label>
                <input type="number" step="0.01" min="0" id="exchangeRateInput">
                <span class="hint">預設 31.5；改動後按下方「儲存」生效</span>
            </div>
            <div id="pricingTableWrap"></div>
            <div class="pricing-actions">
                <button class="btn btn-secondary" id="pricingResetBtn">回復預設值</button>
                <button class="btn btn-primary" id="pricingSaveBtn">儲存</button>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="no-logs" style="grid-column: 1 / -1;">載入中...</div>
        </div>

        <div class="filter-row">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">全部</button>
                <button class="filter-tab tab-scheduling" data-filter="scheduling">📋 排班</button>
                <button class="filter-tab tab-edit_qa" data-filter="edit_qa">💬 問答</button>
                <button class="filter-tab tab-failed" data-filter="failed">⚠️ 失敗</button>
            </div>
            <div class="serve-filter">
                <label for="serveFilter">崇拜：</label>
                <select id="serveFilter">
                    <option value="all">全部崇拜</option>
                </select>
            </div>
        </div>

        <div class="log-list" id="logList">
            <div class="no-logs">載入中...</div>
        </div>

        <div class="load-more-wrap">
            <button class="load-more-btn" id="loadMoreBtn" style="display: none;">載入更早的記錄</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js';
        import {
            getFirestore, collection, doc, getDoc, getDocs, query, orderBy, limit, startAfter
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { firebaseConfig, RECAPTCHA_SITE_KEY } from '../firebase-config.js';

        const PAGE_SIZE = 200;

        // ===== 模型定價（localStorage 持久化） =====
        // 預設參考值（USD / 1M tokens）。若你的合約價不同，按「模型定價」按鈕修改。
        const PRICING_STORAGE_KEY = 'agent_log_pricing_v1';
        const DEFAULT_PRICING = {
            // Anthropic
            'claude-opus-4-7': { input: 5, output: 25 },
            'claude-sonnet-4-6': { input: 3, output: 15 },
            // OpenAI
            // 'gpt-5': { input: 2, output: 8 },
            // Gemini
            'gemini-3.1-pro-preview': { input: 2, output: 12 },
            'gemini-3.5-flash': { input: 1.5, output: 9 },
            'gemini-3-flash': { input: 0.5, output: 3 },
            // DeepSeek
            'deepseek-v4-pro': { input: 0.43, output: 0.87 },
            'deepseek-v4-flash': { input: 0.11, output: 0.22 },
        };

        function loadPricing() {
            try {
                const raw = localStorage.getItem(PRICING_STORAGE_KEY);
                if (!raw) return { ...DEFAULT_PRICING };
                const parsed = JSON.parse(raw);
                // 與預設合併（讓使用者保留自訂的同時也撿到新加入的預設模型）
                return { ...DEFAULT_PRICING, ...parsed };
            } catch {
                return { ...DEFAULT_PRICING };
            }
        }

        function savePricing(p) {
            try {
                localStorage.setItem(PRICING_STORAGE_KEY, JSON.stringify(p));
            } catch (err) {
                console.warn('pricing save failed:', err);
            }
        }

        // ===== USD → TWD 匯率（localStorage 持久化） =====
        const EXCHANGE_STORAGE_KEY = 'agent_log_exchange_rate_v1';
        const DEFAULT_EXCHANGE_RATE = 31.5;

        function loadExchangeRate() {
            try {
                const raw = localStorage.getItem(EXCHANGE_STORAGE_KEY);
                if (!raw) return DEFAULT_EXCHANGE_RATE;
                const n = Number(raw);
                return Number.isFinite(n) && n > 0 ? n : DEFAULT_EXCHANGE_RATE;
            } catch {
                return DEFAULT_EXCHANGE_RATE;
            }
        }

        function saveExchangeRate(rate) {
            try {
                localStorage.setItem(EXCHANGE_STORAGE_KEY, String(rate));
            } catch (err) {
                console.warn('exchange rate save failed:', err);
            }
        }

        let pricing = loadPricing();
        let exchangeRate = loadExchangeRate();

        function estimateCostUSD(log) {
            const body = log.response_body;
            const usage = (body && typeof body === 'object') ? body.usage : null;
            if (!usage || typeof usage !== 'object') return null;
            const inTok = Number(usage.input_tokens) || 0;
            const outTok = Number(usage.output_tokens) || 0;
            if (inTok === 0 && outTok === 0) return null;
            const model = log.model || '';
            const price = pricing[model];
            if (!price) return null;
            const cost = (inTok * (Number(price.input) || 0) + outTok * (Number(price.output) || 0)) / 1_000_000;
            return cost;
        }

        // 顯示用：USD 金額換算成 TWD 並格式化（NT$x.xx）
        function formatCost(usd) {
            if (usd === null || usd === undefined || !Number.isFinite(usd)) return null;
            const twd = usd * exchangeRate;
            if (twd < 0.01) return `≈NT$0`;
            if (twd < 1) return `NT$${twd.toFixed(2)}`;
            if (twd < 100) return `NT$${twd.toFixed(2)}`;
            return `NT$${twd.toFixed(0)}`;
        }

        let db;
        let allLogs = [];
        let lastSnapshot = null;        // 用於 startAfter 接續分頁
        let hasMore = true;
        let currentFilter = 'all';
        let currentServeFilter = 'all';
        const serveMap = {}; // { collectionId: { name, emoji } } 從 _config/serve-list 載入

        const statsGridEl = document.getElementById('statsGrid');
        const logListEl = document.getElementById('logList');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const serveFilterEl = document.getElementById('serveFilter');
        const pricingBtn = document.getElementById('pricingBtn');
        const pricingPanel = document.getElementById('pricingPanel');
        const pricingTableWrap = document.getElementById('pricingTableWrap');
        const pricingSaveBtn = document.getElementById('pricingSaveBtn');
        const pricingResetBtn = document.getElementById('pricingResetBtn');
        const exchangeRateInput = document.getElementById('exchangeRateInput');

        async function init() {
            const app = initializeApp(firebaseConfig);
            initializeAppCheck(app, {
                provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
                isTokenAutoRefreshEnabled: true
            });
            db = getFirestore(app);

            refreshBtn.addEventListener('click', () => reloadAll());
            loadMoreBtn.addEventListener('click', () => loadPage(/*append=*/true));

            pricingBtn.addEventListener('click', () => {
                const isOpen = pricingPanel.classList.toggle('open');
                if (isOpen) {
                    renderPricingTable();
                    exchangeRateInput.value = exchangeRate;
                }
            });
            pricingSaveBtn.addEventListener('click', () => {
                const next = {};
                pricingTableWrap.querySelectorAll('tr[data-model]').forEach(tr => {
                    const m = tr.dataset.model;
                    const inEl = tr.querySelector('.pricing-input-in');
                    const outEl = tr.querySelector('.pricing-input-out');
                    const inVal = Number(inEl.value);
                    const outVal = Number(outEl.value);
                    if (Number.isFinite(inVal) && Number.isFinite(outVal) && (inVal > 0 || outVal > 0)) {
                        next[m] = { input: inVal, output: outVal };
                    }
                });
                pricing = { ...DEFAULT_PRICING, ...next };
                savePricing(next);

                // 匯率：非正數 → 退回預設值（避免被使用者打成 0 害除錯困難）
                const rateVal = Number(exchangeRateInput.value);
                exchangeRate = (Number.isFinite(rateVal) && rateVal > 0) ? rateVal : DEFAULT_EXCHANGE_RATE;
                saveExchangeRate(exchangeRate);

                pricingPanel.classList.remove('open');
                render();
            });
            pricingResetBtn.addEventListener('click', () => {
                if (!confirm('確定要回復所有模型的預設定價與匯率？你目前的自訂值會被清除。')) return;
                localStorage.removeItem(PRICING_STORAGE_KEY);
                localStorage.removeItem(EXCHANGE_STORAGE_KEY);
                pricing = { ...DEFAULT_PRICING };
                exchangeRate = DEFAULT_EXCHANGE_RATE;
                exchangeRateInput.value = exchangeRate;
                renderPricingTable();
                render();
            });

            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.addEventListener('click', () => setFilter(btn.dataset.filter));
            });

            serveFilterEl.addEventListener('change', (e) => {
                currentServeFilter = e.target.value;
                render();
            });

            await loadServeList();
            await reloadAll();
        }

        async function loadServeList() {
            try {
                const snap = await getDoc(doc(db, '_config', 'serve-list'));
                if (!snap.exists()) return;
                const serves = snap.data().serves || [];
                for (const s of serves) {
                    if (s && s.id) {
                        serveMap[s.id] = { name: s.name || s.id, emoji: s.emoji || '' };
                    }
                }
            } catch (err) {
                console.warn('載入 _config/serve-list 失敗:', err);
            }
        }

        function formatServe(id) {
            if (!id) return '(未指定)';
            const info = serveMap[id];
            if (!info) return id;
            return `${info.emoji ? info.emoji + ' ' : ''}${info.name}`;
        }

        function renderPricingTable() {
            // 模型來源：預設清單 ∪ 已載入 logs 出現過的模型
            const seenModels = new Set(Object.keys(pricing));
            allLogs.forEach(l => { if (l.model) seenModels.add(l.model); });
            const models = Array.from(seenModels).sort();
            const rows = models.map(m => {
                const p = pricing[m] || { input: 0, output: 0 };
                return `
                    <tr data-model="${escapeHtml(m)}">
                        <td><code>${escapeHtml(m)}</code></td>
                        <td><input type="number" step="0.01" min="0" class="pricing-input-in" value="${Number(p.input) || 0}"></td>
                        <td><input type="number" step="0.01" min="0" class="pricing-input-out" value="${Number(p.output) || 0}"></td>
                    </tr>
                `;
            }).join('');
            pricingTableWrap.innerHTML = `
                <table class="pricing-table">
                    <thead>
                        <tr>
                            <th>Model</th>
                            <th>Input ($/MTok)</th>
                            <th>Output ($/MTok)</th>
                        </tr>
                    </thead>
                    <tbody>${rows || '<tr><td colspan="3" style="text-align:center;color:var(--text-secondary);padding:16px;">尚無模型資料</td></tr>'}</tbody>
                </table>
            `;
        }

        function refreshServeFilterOptions() {
            // 把 logs 中出現過的 serve-id（即使 _config 沒有也要列出來）合進選項
            const seen = new Set();
            allLogs.forEach(l => { if (l['serve-id']) seen.add(l['serve-id']); });
            // 從 serveMap 取出順序，但允許 logs 自己帶入 _config 沒登記的 id
            const ids = Array.from(new Set([...Object.keys(serveMap), ...seen]));
            const prev = currentServeFilter;
            serveFilterEl.innerHTML = '<option value="all">全部崇拜</option>' +
                ids.map(id => `<option value="${escapeHtml(id)}">${escapeHtml(formatServe(id))}</option>`).join('');
            // 還原前次選擇（若仍存在）
            if (ids.includes(prev)) serveFilterEl.value = prev;
            else serveFilterEl.value = 'all';
            currentServeFilter = serveFilterEl.value;
        }

        async function reloadAll() {
            allLogs = [];
            lastSnapshot = null;
            hasMore = true;
            statsGridEl.innerHTML = '<div class="no-logs" style="grid-column: 1 / -1;">載入中...</div>';
            logListEl.innerHTML = '<div class="no-logs">載入中...</div>';
            loadMoreBtn.style.display = 'none';
            await loadPage(/*append=*/false);
        }

        async function loadPage(append) {
            try {
                // 用 wall_clock_utc 排序而非 __name__：Firestore 對 __name__ desc 需要明確的 composite
                // index，但 wall_clock_utc 是一般字串欄位，預設就有自動建立的 asc/desc 單欄位索引；
                // 兩者排出來結果相同（doc id 與 wall_clock_utc 都是 ISO 時間字串）。
                let q;
                if (append && lastSnapshot) {
                    q = query(
                        collection(db, 'agent_log'),
                        orderBy('wall_clock_utc', 'desc'),
                        startAfter(lastSnapshot),
                        limit(PAGE_SIZE)
                    );
                } else {
                    q = query(
                        collection(db, 'agent_log'),
                        orderBy('wall_clock_utc', 'desc'),
                        limit(PAGE_SIZE)
                    );
                }

                const snap = await getDocs(q);
                if (snap.empty) {
                    hasMore = false;
                } else {
                    lastSnapshot = snap.docs[snap.docs.length - 1];
                    snap.forEach(d => allLogs.push({ id: d.id, ...d.data() }));
                    hasMore = snap.size === PAGE_SIZE;
                }

                refreshServeFilterOptions();
                render();
            } catch (err) {
                console.error('載入 agent_log 失敗:', err);
                logListEl.innerHTML = `<div class="no-logs">載入失敗：${err.message}</div>`;
                statsGridEl.innerHTML = '';
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            render();
        }

        function applyFilter(logs) {
            let out = logs;
            if (currentServeFilter !== 'all') {
                out = out.filter(l => (l['serve-id'] || '') === currentServeFilter);
            }
            if (currentFilter === 'all') return out;
            if (currentFilter === 'failed') return out.filter(l => (l.status_code ?? 0) !== 200);
            return out.filter(l => l.mode === currentFilter);
        }

        function render() {
            const filtered = applyFilter(allLogs);
            renderStats(filtered);
            renderList(filtered);
            loadMoreBtn.style.display = hasMore ? 'inline-block' : 'none';
            loadMoreBtn.disabled = !hasMore;
            loadMoreBtn.textContent = hasMore ? '載入更早的記錄' : '已經是全部記錄了';
        }

        // ===== 統計 =====
        function renderStats(logs) {
            if (logs.length === 0) {
                statsGridEl.innerHTML = '<div class="no-logs" style="grid-column: 1 / -1;">沒有符合的記錄</div>';
                return;
            }

            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            // 週一作為一週起點
            const startOfWeek = new Date(startOfToday);
            const dayOfWeek = (startOfToday.getDay() + 6) % 7; // 週一 = 0
            startOfWeek.setDate(startOfToday.getDate() - dayOfWeek);

            let todayCount = 0, weekCount = 0;
            let okCount = 0;
            let timeSum = 0, timeN = 0;
            let costSum = 0, costN = 0, costMissingModels = new Set();
            const modeDist = {};
            const providerDist = {};

            logs.forEach(l => {
                const ts = l.wall_clock_utc ? new Date(l.wall_clock_utc) : null;
                if (ts) {
                    if (ts >= startOfToday) todayCount++;
                    if (ts >= startOfWeek) weekCount++;
                }
                if ((l.status_code ?? 0) === 200) okCount++;
                if (typeof l.inference_time === 'number') {
                    timeSum += l.inference_time;
                    timeN++;
                }
                modeDist[l.mode || '(unknown)'] = (modeDist[l.mode || '(unknown)'] || 0) + 1;
                providerDist[l.provider || '(unknown)'] = (providerDist[l.provider || '(unknown)'] || 0) + 1;

                const cost = estimateCostUSD(l);
                if (cost !== null) {
                    costSum += cost;
                    costN++;
                } else if (l.model && !pricing[l.model]) {
                    costMissingModels.add(l.model);
                }
            });

            const total = logs.length;
            const successRate = total > 0 ? (okCount / total * 100).toFixed(1) : '0.0';
            const avgTime = timeN > 0 ? (timeSum / timeN).toFixed(2) : '—';
            const costTwd = costSum * exchangeRate;
            const costLabel = costN > 0
                ? (costTwd < 1 ? `NT$${costTwd.toFixed(2)}` : (costTwd < 100 ? `NT$${costTwd.toFixed(2)}` : `NT$${costTwd.toFixed(0)}`))
                : '—';
            const costSubBase = costMissingModels.size > 0
                ? `缺少定價：${Array.from(costMissingModels).join(', ')}`
                : `基於 ${costN} 筆有 usage 與定價的記錄`;
            const costSub = costN > 0
                ? `${costSubBase}（≈ $${costSum.toFixed(4)} USD，匯率 ${exchangeRate}）`
                : costSubBase;

            statsGridEl.innerHTML = `
                <div class="stat-card">
                    <div class="stat-card-title">總呼叫數（已載入）</div>
                    <div class="stat-card-value">${total}</div>
                    <div class="stat-card-sub">今日 ${todayCount} / 本週 ${weekCount}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-title">成功率</div>
                    <div class="stat-card-value">${successRate}%</div>
                    <div class="stat-card-sub">成功 ${okCount} / 失敗 ${total - okCount}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-title">平均推論時間</div>
                    <div class="stat-card-value">${avgTime}${avgTime === '—' ? '' : ' s'}</div>
                    <div class="stat-card-sub">基於 ${timeN} 筆有計時的記錄</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-title">💵 估計總花費</div>
                    <div class="stat-card-value">${costLabel}</div>
                    <div class="stat-card-sub">${escapeHtml(costSub)}</div>
                </div>
                <div class="stat-card wide">
                    <div class="stat-card-title">模式分布</div>
                    ${renderBarList(modeDist, total, 'mode')}
                </div>
                <div class="stat-card wide">
                    <div class="stat-card-title">Provider 分布</div>
                    ${renderBarList(providerDist, total, 'provider')}
                </div>
            `;
        }

        function renderBarList(dist, total, kind) {
            const entries = Object.entries(dist).sort((a, b) => b[1] - a[1]);
            if (entries.length === 0) return '<div class="stat-card-sub">無資料</div>';
            return `<div class="stat-bar-list">${entries.map(([k, n]) => {
                const pct = total > 0 ? (n / total * 100) : 0;
                const safeKey = k.replace(/[^a-zA-Z0-9_]/g, '_');
                return `
                    <div class="stat-bar-row">
                        <span class="stat-bar-label">${escapeHtml(k)}</span>
                        <div class="stat-bar-track">
                            <div class="stat-bar-fill ${safeKey}" style="width: ${pct}%;"></div>
                        </div>
                        <span class="stat-bar-count">${n}</span>
                    </div>
                `;
            }).join('')}</div>`;
        }

        // ===== 列表 =====
        function renderList(logs) {
            if (logs.length === 0) {
                logListEl.innerHTML = '<div class="no-logs">沒有符合的 AI 互動記錄</div>';
                return;
            }

            logListEl.innerHTML = logs.map(log => {
                const isFail = (log.status_code ?? 0) !== 200;
                const tsLabel = formatTwTime(log.wall_clock_utc);
                const userPrompt = extractLastUserPrompt(log.messages);
                const promptPreview = userPrompt
                    ? escapeHtml(userPrompt.slice(0, 200))
                    : '<em>(無 user prompt)</em>';
                const truncBadge = (log.truncated_fields && log.truncated_fields.length > 0)
                    ? `<span class="badge badge-truncated">⚠️ ${log.truncated_fields.length} 欄位被截斷</span>`
                    : '';
                const modeKey = log.mode || 'unknown';
                const modeBadgeClass = `badge-mode-${modeKey === 'scheduling' || modeKey === 'edit_qa' ? modeKey : 'edit_qa'}`;
                const serveId = log['serve-id'] || '';
                const serveBadge = serveId
                    ? `<span class="badge badge-serve">${escapeHtml(formatServe(serveId))}</span>`
                    : '<span class="badge badge-serve">(未指定崇拜)</span>';
                const cost = estimateCostUSD(log);
                const costLbl = formatCost(cost);
                const costBadge = costLbl ? `<span class="badge badge-cost">💵 ${costLbl}</span>` : '';
                return `
                    <div class="log-card ${isFail ? 'failed' : ''}">
                        <div class="log-header">
                            <div>
                                <div class="log-title">
                                    ${serveBadge}
                                    <span class="badge ${modeBadgeClass}">${escapeHtml(modeKey)}</span>
                                    <span class="badge badge-provider">${escapeHtml(log.provider || '?')} / ${escapeHtml(log.model || '?')}</span>
                                    <span class="badge ${isFail ? 'badge-status-fail' : 'badge-status-ok'}">${log.status_code ?? '?'}</span>
                                    ${typeof log.inference_time === 'number' ? `<span class="badge badge-provider">${log.inference_time.toFixed(2)}s</span>` : ''}
                                    ${log.enable_thinking ? '<span class="badge badge-thinking">🧠 思考</span>' : ''}
                                    ${costBadge}
                                    ${truncBadge}
                                </div>
                                <div class="log-meta">${tsLabel} · doc id <code>${escapeHtml(log.id)}</code></div>
                                <div class="log-prompt-preview">${promptPreview}</div>
                            </div>
                            <button class="toggle-btn" data-toggle="${log.id}">展開詳情</button>
                        </div>
                        <div class="detail-section" id="detail-${log.id}"></div>
                    </div>
                `;
            }).join('');

            // 綁展開事件(避免 inline onclick 與 escape 麻煩)
            logListEl.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.addEventListener('click', () => toggleDetail(btn.dataset.toggle, btn));
            });
        }

        function toggleDetail(logId, btnEl) {
            const detailEl = document.getElementById(`detail-${logId}`);
            if (!detailEl) return;
            if (detailEl.classList.contains('open')) {
                detailEl.classList.remove('open');
                detailEl.innerHTML = '';
                btnEl.textContent = '展開詳情';
                return;
            }
            const log = allLogs.find(l => l.id === logId);
            if (!log) return;
            detailEl.innerHTML = renderDetail(log);
            detailEl.classList.add('open');
            btnEl.textContent = '收起詳情';
        }

        function extractScheduleData(responseBody) {
            if (!responseBody || typeof responseBody !== 'object') return null;
            if (!Array.isArray(responseBody.scheduleData)) return null;
            return responseBody.scheduleData;
        }

        function responseBodyForDisplay(responseBody) {
            // 把 scheduleData 從 response_body 拿掉（換成 "..."），讓上方 JSON 不要塞滿整片
            if (!responseBody || typeof responseBody !== 'object') return responseBody;
            if (!Array.isArray(responseBody.scheduleData)) return responseBody;
            return { ...responseBody, scheduleData: '...' };
        }

        function renderScheduleTable(scheduleData) {
            if (!Array.isArray(scheduleData) || scheduleData.length === 0) {
                return '<div style="padding:12px;color:var(--text-secondary);">(空)</div>';
            }
            // 蒐集所有欄位（date 永遠第一欄；其他欄位以第一筆出現順序保留，新欄位往後接）
            const colOrder = [];
            const colSet = new Set();
            scheduleData.forEach(row => {
                if (!row || typeof row !== 'object') return;
                Object.keys(row).forEach(k => {
                    if (k === 'date') return;
                    if (!colSet.has(k)) { colSet.add(k); colOrder.push(k); }
                });
            });
            const cols = ['date', ...colOrder];
            const thead = `<thead><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>`;
            const tbody = `<tbody>${scheduleData.map(row => {
                if (!row || typeof row !== 'object') {
                    return `<tr><td colspan="${cols.length}"><em>(invalid row)</em></td></tr>`;
                }
                return `<tr>${cols.map(c => {
                    const v = row[c];
                    const cls = c === 'date' ? 'date-cell' : '';
                    let cell;
                    if (Array.isArray(v)) {
                        cell = v.map(x => escapeHtml(String(x))).join('、');
                    } else if (v === null || v === undefined) {
                        cell = '';
                    } else if (typeof v === 'object') {
                        cell = escapeHtml(JSON.stringify(v));
                    } else {
                        cell = escapeHtml(String(v));
                    }
                    return `<td class="${cls}">${cell || '&nbsp;'}</td>`;
                }).join('')}</tr>`;
            }).join('')}</tbody>`;
            return `<div class="schedule-table-wrap"><table class="schedule-table">${thead}${tbody}</table></div>`;
        }

        function renderDetail(log) {
            let html = '';

            if (log.truncated_fields && log.truncated_fields.length > 0) {
                html += `<div class="truncate-warning">⚠️ 此筆 ${log.truncated_fields.map(escapeHtml).join('、')} 欄位已截斷，完整內容請查 Firestore Console（doc id <code>${escapeHtml(log.id)}</code>）</div>`;
            }

            html += `
                <div class="detail-block">
                    <div class="detail-block-title">System Prompt</div>
                    <pre>${escapeHtml(log.system_prompt || '(空)')}</pre>
                </div>
            `;

            // Thinking 區塊：只在有內容時顯示
            const thinking = (log.thinking || '').trim();
            if (thinking) {
                html += `
                    <div class="detail-block">
                        <div class="detail-block-title">🧠 Thinking</div>
                        <pre class="thinking-pre">${escapeHtml(thinking)}</pre>
                    </div>
                `;
            }

            html += `
                <div class="detail-block">
                    <div class="detail-block-title">Messages（${(log.messages || []).length} 則）</div>
                    ${(log.messages || []).map(m => `
                        <div class="message-row">
                            <div class="message-role">${escapeHtml(m.role || '?')}</div>
                            <div class="message-content">${escapeHtml(typeof m.content === 'string' ? m.content : JSON.stringify(m.content, null, 2))}</div>
                        </div>
                    `).join('') || '<em>(無 messages)</em>'}
                </div>
            `;

            const scheduleData = extractScheduleData(log.response_body);
            const bodyForDisplay = responseBodyForDisplay(log.response_body);

            html += `
                <div class="detail-block">
                    <div class="detail-block-title">Response Body</div>
                    <pre>${escapeHtml(safeJsonStringify(bodyForDisplay))}</pre>
                </div>
            `;

            if (scheduleData !== null) {
                html += `
                    <div class="detail-block schedule-block">
                        <div class="detail-block-title">
                            Schedule Data（${scheduleData.length} 列）
                            <span class="view-toggle" data-target="${log.id}">
                                <button type="button" class="view-toggle-btn active" data-view="table" data-target="${log.id}">表格</button>
                                <button type="button" class="view-toggle-btn" data-view="json" data-target="${log.id}">JSON</button>
                            </span>
                        </div>
                        <div id="schedule-view-${log.id}">${renderScheduleTable(scheduleData)}</div>
                    </div>
                `;
            }

            return html;
        }

        // 委派事件：JSON / 表格 切換
        logListEl.addEventListener('click', (e) => {
            const btn = e.target.closest('.view-toggle-btn');
            if (!btn) return;
            const logId = btn.dataset.target;
            const view = btn.dataset.view;
            const log = allLogs.find(l => l.id === logId);
            if (!log) return;
            const scheduleData = extractScheduleData(log.response_body);
            if (scheduleData === null) return;
            const viewEl = document.getElementById(`schedule-view-${logId}`);
            const toggleWrap = btn.parentElement;
            toggleWrap.querySelectorAll('.view-toggle-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.view === view);
            });
            if (view === 'table') {
                viewEl.innerHTML = renderScheduleTable(scheduleData);
            } else {
                viewEl.innerHTML = `<pre>${escapeHtml(safeJsonStringify(scheduleData))}</pre>`;
            }
        });

        // ===== utils =====
        function formatTwTime(iso) {
            if (!iso) return '(無時間)';
            try {
                return new Date(iso).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false });
            } catch {
                return iso;
            }
        }

        function extractLastUserPrompt(messages) {
            if (!Array.isArray(messages)) return '';
            for (let i = messages.length - 1; i >= 0; i--) {
                if (messages[i].role === 'user') {
                    const c = messages[i].content;
                    return typeof c === 'string' ? c : JSON.stringify(c);
                }
            }
            return '';
        }

        function safeJsonStringify(v) {
            try {
                return JSON.stringify(v, null, 2);
            } catch {
                return String(v);
            }
        }

        function escapeHtml(s) {
            if (s === null || s === undefined) return '';
            return String(s)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        init();
    </script>
</body>
